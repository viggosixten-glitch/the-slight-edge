<style>
:root{
  --bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6;
  --green:#10D95B;--red:#FF5B4A;--priv:#10D95B;--biz:#1A8FE3;--amber:#FFB81C;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --ser:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6}}
:root[data-theme="dark"]{--bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none;font-optical-sizing:auto}
button,[role="button"],.chip,.mini,.tl{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.swipe>.habit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lbl,.st,.sm,.mu,.legend span,.chip,.lbl2,.qmeta,.qlater,.hero-q span,.edge,.frow,.due,.warn{letter-spacing:.01em}
.h2,.cost .ttl{letter-spacing:-.025em}
.qstage{overscroll-behavior:contain}
html,body{background:var(--bg);color:var(--tx);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{padding:12px 12px 56px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:0;border-radius:14px;padding:12px 14px;width:100%;outline:none}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:#6E6D78}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* Hero */
.hero{position:relative;border-radius:46px;overflow:hidden;aspect-ratio:3/4;max-height:560px;width:100%;background:var(--s1)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,11,.62) 0%,rgba(8,8,11,.05) 24%,rgba(8,8,11,.42) 52%,rgba(8,8,11,.88) 76%,rgba(8,8,11,.99) 100%)}
.hero-top{position:absolute;z-index:2;top:16px;left:18px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top .d{font-weight:700;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.hero-q{position:absolute;z-index:2;left:22px;right:22px;bottom:24px}
.hero-q p{font-family:var(--ser);font-style:italic;font-size:clamp(27px,7.4vw,36px);line-height:1.12;letter-spacing:-.01em}
.hero-q span{display:block;margin-top:12px;color:var(--mu);font-size:14px;font-weight:700}

/* Cards */
.card{background:var(--s1);border-radius:42px;padding:20px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu)}

.north{background:var(--biz);color:var(--bg);text-align:left;width:100%}
.north .big{font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.north .sub{margin-top:14px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:999px;background:rgba(16,13,24,.22);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--bg)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;border-radius:38px;padding:18px 16px;background:var(--s1);display:flex;flex-direction:column;gap:4px;min-height:132px}
.mcard .lbl{font-size:13px;font-weight:700}
.mcard .amt{font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:-.03em;margin-top:auto}
.mcard .sm{font-size:12px;color:var(--mu);font-weight:600}

/* Habits */
.today-h{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;opacity:.25}
.dots i.on{opacity:1}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--s1);border-radius:32px;padding:16px;transition:background-color .18s ease,color .18s ease,transform .1s ease}
.habit:active{transform:scale(.985)}
.habit .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.habit .dot svg{opacity:0;transition:opacity .15s}
.habit .mid{min-width:0;flex:1}
.habit .area{font-size:13px;font-weight:800}
.habit .txt{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px}
.habit .warn{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit .stk{text-align:right;flex:none}
.habit .stk b{display:block;font-size:24px;font-weight:800;line-height:1}
.habit .stk small{font-size:11px;font-weight:700;opacity:.7}
.habit.done{color:var(--bg)}
.habit.done .dot svg{opacity:1}
.habit.done .area{color:var(--bg)!important;opacity:.7}
.habit .due{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit.done .due{display:none}
.lhead{display:flex;align-items:center;gap:8px;padding:8px 6px 0;font-weight:800;font-size:15px}
.lhead i{width:10px;height:10px;border-radius:50%}
.lhead small{color:var(--mu);font-weight:700;font-size:13px;margin-left:auto}
.fixed{width:100%;text-align:left}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;padding:5px 0}
.frow span:last-child{font-weight:800}
.left{margin-top:12px;border-radius:22px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.left b{font-size:22px;letter-spacing:-.02em}
.fx{display:flex;gap:8px;margin-top:8px}
.fx input:first-child{flex:1.6}.fx input:nth-child(2){flex:1}
.fx button{flex:none;width:46px;border-radius:14px;background:var(--s2);font-weight:800;font-size:20px;color:var(--red)}
.cost{display:flex;gap:8px;background:var(--s1);border-radius:42px;padding:8px;touch-action:pan-y;user-select:none}
.cost .full{flex:1;min-width:0;padding:12px 8px 14px 12px}
.cost .full.in-l{animation:inl .22s ease-out}.cost .full.in-r{animation:inr .22s ease-out}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}}@keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cost .mini{flex:none;width:44px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--bg);letter-spacing:.02em}
.cost .mini span{writing-mode:vertical-rl}
.cost .mini.l span{transform:rotate(180deg)}
.cost .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cost .ttl{font-size:19px;font-weight:800;letter-spacing:-.02em}
.cost .st{font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.cost .sum{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.more{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx)}
.tl{width:100%;text-align:left;background:var(--s2);border-radius:26px;padding:14px;margin-top:8px}
.tl .row b{font-size:15px;font-weight:800}
.tl .cnt{display:flex;gap:6px}
.tl .cnt span{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;color:var(--bg)}
.tl .grp{margin-top:12px}
.tl .grp h4{font-size:13px;font-weight:800;margin-bottom:4px}
.tl .grp p{font-size:15px;line-height:1.45;font-weight:500}
.edge{padding:6px 6px 2px;font-size:17px;font-weight:700;line-height:1.3;color:var(--mu)}
.edge b{font-size:30px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin:0 2px}
.goal{margin-top:14px}
.goal .gl{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.swipe{position:relative;border-radius:32px;overflow:hidden}
.swipe>.del{position:absolute;top:1.5px;bottom:1.5px;right:1.5px;left:1.5px;clip-path:inset(0 0 0 100% round 0 30px 30px 0);border-radius:30px;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:var(--bg);font-weight:800;font-size:14px;overflow:hidden;white-space:nowrap}
.swipe:not(.sw)>.del{visibility:hidden}
.swipe>.del>.dt{position:absolute;right:0;top:0;bottom:0;width:25%;display:flex;align-items:center;justify-content:center}
.swipe>.del.snap{transition:clip-path .32s var(--ease-out)}
.swipe.sw>.habit,.swipe.sw>.del{will-change:transform,clip-path}
.swipe>.del.full{transition:clip-path .22s var(--ease-out);clip-path:inset(-1px round 32px)!important;inset:0!important;border-radius:32px}
.swipe>.del.full>.dt{opacity:0;transition:opacity .15s var(--ease-out)}
.swipe.gone{transition:transform .45s var(--ease-io),opacity .45s var(--ease-io)!important;opacity:0}
.swipe.gone-l{transform:translateX(-112%)}.swipe.gone-r{transform:translateX(112%)}
.bubble{position:fixed;z-index:60;display:grid;place-items:center;pointer-events:none;overflow:hidden;will-change:transform,opacity}
.bubble .bt{position:absolute;left:78px;right:16px;top:50%;transform:translateY(-50%);font-size:17px;font-weight:700;line-height:1.2;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble svg{width:52%;height:52%;opacity:0}
body{overflow-anchor:none}
.swipe.arriving{opacity:0;transform:scale(.96)}
.swipe.arrived{transition:opacity .28s var(--ease-out),transform .32s var(--ease-out)}
.habit .ck,.del .ck{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.del .ck svg{width:38px;height:38px;animation:popin .3s var(--ease-out) .12s both}
.del .ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .3s var(--ease-out) .2s forwards}
.habit .ck svg{width:40px;height:40px;animation:popin .3s var(--ease-out) both}
.habit .ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .28s var(--ease-out) .1s forwards}
.habit.clearing .dot,.habit.clearing .mid{opacity:0;transition:opacity .15s var(--ease-out)}
.dlg .big{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--priv);margin-top:4px}
.dlg .cap{display:flex;gap:8px;margin-top:14px}
.dlg .cap input{flex:1;background:var(--s2)}
.dlg .cap button{flex:none;width:52px;border-radius:16px;background:var(--priv);color:var(--bg);font-size:24px;font-weight:800}
.grp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s2);border-radius:26px;padding:13px 14px;margin-top:8px}
.grp .gt{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.25}
.grp .gm{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:3px;letter-spacing:.01em}
.grp .gc{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--mu)}
.grp.solved .gt{color:var(--mu);text-decoration:line-through}
.grp.solved .gc{background:var(--green);color:var(--bg)}
.clearbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:30px;padding:14px 16px;font-weight:800;font-size:16px;letter-spacing:-.01em;color:#10D95B;background:rgba(16,217,91,.12);transition:transform .12s var(--ease-out),background-color .2s ease}
.clearbtn:active{transform:scale(.97);background:rgba(16,217,91,.2)}
.clearbtn .cbi{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#10D95B;color:var(--bg)}
.clearbtn .cbi svg{width:14px;height:14px}
.archlink{display:block;margin:0 auto;color:var(--mu);font-size:14px;font-weight:600;padding:8px 14px;letter-spacing:.01em}
.arch{display:flex;flex-direction:column;gap:2px;padding:0 8px 4px}
.arch .ai{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--mu);font-size:15px;font-weight:600}
.arch .ai svg{flex:none;color:var(--green)}
.arch .ai span{flex:1;min-width:0}
.arch .ai small{font-size:12px;opacity:.8}
.swipe>.habit{position:relative;touch-action:pan-y}
.swipe>.habit.snap{transition:transform .32s var(--ease-out),background-color .18s ease}
.swipe>.habit.out{transition:transform .2s var(--ease-out),opacity .2s var(--ease-out);transform:translateX(-110%)!important;opacity:0}
.hbtn{display:flex;gap:8px;align-items:center}
.rbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--tx);font-size:22px;font-weight:800}
.undo-w{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;background:rgba(40,40,46,.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);color:var(--tx);border-radius:999px;padding:8px 8px 8px 18px;font-weight:800;font-size:15px;max-width:496px;width:100%;justify-content:space-between;animation:up .2s ease-out}
.undo button{background:var(--tx);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(12px)}}

/* Färgmoln */
/* Gör ljusets höjd och styrka animerbara, så att Dagens edge kan glida mellan nivåer */
@property --gh{syntax:'<length>';inherits:true;initial-value:190px}
@property --ga{syntax:'<number>';inherits:true;initial-value:1}
.card.edgecard.glow{padding-bottom:59px;transition:--gh .9s cubic-bezier(.23,1,.32,1),--ga .9s cubic-bezier(.23,1,.32,1)}
.glow{--g1:70,70,90;--g2:90,90,110;--g3:130,130,150;--ga:1;--gh:190px;
  position:relative;background-color:#0B0B0F;overflow:hidden;
  background-image:
    radial-gradient(58% calc(var(--gh)*.60) at 27% calc(100% + var(--gh)*.05),rgba(255,255,255,calc(.95*var(--ga))) 0%,rgba(255,255,255,.34) 32%,rgba(255,255,255,0) 62%),
    radial-gradient(72% calc(var(--gh)*.94) at 19% calc(100% + var(--gh)*.10),rgba(var(--g3),var(--ga)) 0%,rgba(var(--g3),.48) 36%,rgba(var(--g3),0) 72%),
    radial-gradient(84% calc(var(--gh)*1.08) at 81% calc(100% + var(--gh)*.12),rgba(var(--g2),var(--ga)) 0%,rgba(var(--g2),.52) 38%,rgba(var(--g2),0) 74%),
    radial-gradient(150% calc(var(--gh)*1.5) at 50% calc(100% + var(--gh)*.3),rgba(var(--g1),calc(.98*var(--ga))) 0%,rgba(var(--g1),.42) 46%,rgba(var(--g1),0) 80%),
    linear-gradient(180deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 30%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.17),inset 0 0 14px 1px rgba(255,255,255,.18),
    inset 0 0 34px 4px rgba(255,255,255,.13),inset 0 0 74px 18px rgba(255,255,255,.08)}
.glow>*{position:relative;z-index:1}
.card.glow,.cost.glow,.inl.glow{padding-bottom:calc(20px + var(--gh)*.30)}
.mcard.glow{padding-bottom:calc(16px + var(--gh)*.26)}
.glow .h2,.glow .eff,.glow .amt,.glow .big,.glow .ttl,.glow .nh,.glow .bwn{text-shadow:0 1px 3px rgba(0,0,0,.45),0 2px 12px rgba(0,0,0,.3)}
.glow .mu,.glow .sm,.glow .st,.glow .gm,.glow .lbl,.glow .lbl2,.glow .streaktxt,.glow small,.glow p,.glow .frow{text-shadow:0 1px 2px rgba(0,0,0,.55),0 1px 7px rgba(0,0,0,.4)}
.bloom{position:relative;background-color:#0B0B0F;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),inset 0 0 16px 2px rgba(255,255,255,.14)}
.glow::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;z-index:0;border-radius:inherit;corner-shape:inherit;
  background:radial-gradient(120% calc(var(--gh)*1.1) at 50% calc(100% + var(--gh)*.16),rgba(255,255,255,.55) 0%,rgba(var(--g2),.5) 38%,rgba(var(--g2),0) 70%)}
.glow.pulse::after{animation:gpulse 1.15s var(--ease-out)}
@keyframes gpulse{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.lit{--ga:1;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 0 0 18px 1px rgba(255,255,255,.34),
  inset 0 0 42px 6px rgba(255,255,255,.2),inset 0 0 84px 20px rgba(255,255,255,.11)}
.hero::before{content:'';position:absolute;inset:0;z-index:3;border-radius:inherit;corner-shape:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 0 16px 2px rgba(255,255,255,.17),inset 0 0 44px 9px rgba(255,255,255,.1)}

.sync{font-size:13px;color:var(--mu);font-weight:600;padding:2px 6px}

/* Curve */
.seg{display:flex;background:var(--s2);border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--mu)}
.seg button.on{background:var(--tx);color:var(--bg)}
.chart{margin-top:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.legend i{width:9px;height:9px;border-radius:50%}
.stat{margin-top:14px;font-size:15px;font-weight:600;line-height:1.4}
.stat b{font-weight:800}

/* 10-10-10 */
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.tabs button{flex:1;border-radius:16px;padding:11px 8px;font-size:14px;font-weight:800;background:var(--s2);white-space:nowrap}
.tabs button small{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.li{display:flex;align-items:center;gap:10px}
.li b{width:22px;flex:none;text-align:right;font-weight:800;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border-radius:16px;padding:14px 12px;font-weight:800;font-size:15px;background:var(--s2)}
.btn.fill{color:var(--bg)}

.refl textarea{margin-top:8px}
.refl label{display:block;margin-top:14px;font-weight:700;font-size:15px}

.foot{display:flex;justify-content:center;margin-top:6px}
.foot button{color:var(--mu);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--s1)}

/* Sheet */
.inl{background-color:var(--s1);border-radius:42px;padding:22px 18px;--g1:12,120,190;--g2:22,190,210;--g3:120,240,215;--gh:160px;--ga:.92}
.inl input,.inl textarea,.inl .btn,.inl .fx button{background:var(--s2)}
.inl .btn.fill{background:inherit}
.inl h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.inl p{color:var(--mu);margin-top:6px;font-size:15px;line-height:1.4}
.inl .fld{margin-top:16px}
.inl .fld span{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.inl .acts{margin-top:20px}
.toast{align-self:center;background:var(--tx);color:var(--bg);font-weight:800;padding:10px 16px;border-radius:999px;font-size:14px}
.warnbar{background:var(--red);color:var(--bg);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px}
/* Morgonfrågor */
.qo{position:fixed;inset:0;z-index:80}
.qbg{position:absolute;inset:0;background:rgba(10,10,14,.18);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .35s ease both}
.qo.fade .qbg{animation:fadeout .5s ease both}
@keyframes fadeout{to{opacity:0}}
.qbox{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:520px;margin:0 auto;border-radius:32px;
  background:rgba(8,8,12,.2);-webkit-backdrop-filter:blur(20px) saturate(0%) brightness(.8);backdrop-filter:blur(20px) saturate(0%) brightness(.8);display:flex;flex-direction:column;padding:22px 20px 20px;overflow:hidden;
  animation:qin .36s var(--ease-out) both}
@keyframes qin{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(4px)}}
.qbox.bye{animation:qout .22s var(--ease-out) both}
.qbox.away{animation:qaway .22s var(--ease-out) both}
@keyframes qout{to{opacity:0;transform:scale(.96);filter:blur(4px)}}
@keyframes qaway{to{opacity:0;transform:translateY(20px) scale(.97)}}
.qbox::before,.qbox::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:3px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.qbox::before{background:linear-gradient(115deg,#FF3B3B,#FF9F1C,#FFE14D,#3DDC84,#27C7FF,#3E6BFF,#A45BFF,#FF4FB3,#FF3B3B);background-size:180% 180%;animation:wave1 7s ease-in-out infinite}
.qbox::after{background:linear-gradient(245deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));background-size:260% 260%;animation:wave2 4.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes wave1{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes wave2{0%{background-position:100% 0%}50%{background-position:0% 100%}100%{background-position:100% 0%}}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qprog{display:flex;gap:6px;flex:1}
.qprog i{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.14);transition:background-color .3s ease}
.qprog i.on{background:#10D95B}
.qlater{color:var(--mu);font-weight:700;font-size:14px;padding:6px 4px}
.qmeta{margin-top:18px;font-size:13px;font-weight:800;color:#10D95B;letter-spacing:.02em}
.qstage{flex:1;overflow:auto;margin-top:8px;padding:4px 6px}
.qstage h2{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.qstage p{color:rgba(255,255,255,.74);font-size:15px;line-height:1.4;margin-top:10px;font-weight:600;letter-spacing:.01em}
.qf{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.qi{display:flex;align-items:center;gap:12px}
.qi b{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:#10D95B;color:#07130C;font-size:14px;font-weight:800}
.qstage input,.qstage textarea{background:rgba(255,255,255,.08);font-size:18px;font-weight:600;padding:15px 16px;border-radius:18px}
.qstage textarea{min-height:120px;resize:none;line-height:1.4}
.qin{animation:qstep .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes qstep{from{opacity:0;transform:translateX(var(--qx,30px))}}
.qnav{display:flex;gap:10px;margin-top:14px}
.qnav button{flex:1;border-radius:18px;padding:17px 12px;font-weight:800;font-size:16px}
.qback{background:rgba(255,255,255,.08)}
.qnext{background:#10D95B;color:#07130C;flex:2!important}
.qnext[disabled]{opacity:.35}
.qcheck{position:fixed;inset:0;z-index:81;display:grid;place-items:center;pointer-events:none;z-index:1}
.qcheck svg{width:128px;height:128px;animation:popin .5s cubic-bezier(.2,.8,.2,1) both}
.qcheck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out .25s forwards}
.qcheck.fade svg{animation:qout .25s var(--ease-out) both}
.nudge{color:#fff}
.nudge .nh,.nudge p{text-shadow:0 1px 12px rgba(0,0,0,.5)}
.nudge .nh{font-size:22px;font-weight:800;letter-spacing:-.02em}
.nudge p{margin-top:8px;font-size:16px;line-height:1.4;font-weight:600;opacity:.95}
.edgecard{display:flex;align-items:center;justify-content:space-between;gap:12px}
.edgecard .eff{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.edgecard .lbl2{font-size:13px;font-weight:700;color:var(--mu);margin-bottom:6px}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.chip{border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;background:var(--s2);color:var(--tx);white-space:nowrap}
.chip.ok{background:var(--green);color:var(--bg)}
.chip.go{background:#10D95B;color:#07130C}
.tl .ans{margin-top:12px}
.tl .ans h4{font-size:13px;font-weight:800;color:#10D95B;margin-bottom:4px}
.tl .ans p{font-size:15px;line-height:1.45;font-weight:500}
.tl .ans{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-transparency:reduce){.qbox{background:rgba(24,24,28,.97)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.qbg{background:rgba(10,10,14,.6)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.undo{background:#2E2E34!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.streaktxt{margin-top:8px;font-weight:800;font-size:15px;color:#10D95B;letter-spacing:.01em}
.rcpt{background:linear-gradient(135deg,#0A9E42,#10D95B)!important;color:#07130C}
.rfloat{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;z-index:70;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:rin .45s var(--ease-out) both;cursor:pointer}
@keyframes rin{from{opacity:0;transform:translateY(-14px) scale(.98)}}
.rcpt .rh{font-size:21px;font-weight:800;letter-spacing:-.02em}
.rcpt p{margin-top:6px;font-size:15px;font-weight:700;opacity:.9}
.spark{position:fixed;z-index:70;border-radius:50%;pointer-events:none;will-change:transform,opacity}
/* Mikroanimationer */
.rise{animation:rise .42s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hero.boot img{animation:settle 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{transform:scale(1.07);filter:brightness(.7)}}
.hero.boot .hero-q{animation:rise .7s cubic-bezier(.2,.8,.2,1) .35s both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.45,0,.2,1) .12s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .6s ease .5s both}
@keyframes fade{from{opacity:0}}
.popin{transform-box:fill-box;transform-origin:center;animation:popin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes popin{from{opacity:0;transform:scale(.85)}}
.justdone .dot{animation:dotpop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes dotpop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.justdone .dot svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .34s ease-out .08s forwards}
.dots i{transition:opacity .3s ease}
.dots i.pop{animation:dotpop .42s cubic-bezier(.2,.8,.2,1)}
.inl{animation:sheet .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:top center}
.inl.closing{animation:sheetout .16s var(--ease-out) both}
@keyframes sheet{from{opacity:0;transform:translateY(-10px) scale(.98)}}
@keyframes sheetout{to{opacity:0;transform:translateY(-6px) scale(.98)}}
.toast{animation:popin .35s cubic-bezier(.2,.8,.2,1) both}
.undo-w.out .undo{animation:down .18s var(--ease-out) both}
@keyframes down{to{opacity:0;transform:translateY(14px)}}
.tl .grp{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
button{transition:transform 160ms var(--ease-out),background-color 180ms ease,color 180ms ease,opacity 180ms ease}
.rbtn:active,.btn:active,.mini:active,.mcard:active,.tabs button:active,.seg button:active,.more:active,.foot button:active,.undo button:active,.tl:active,.chip:active,.qnav button:active,.qlater:active{transform:scale(.97)}
.habit:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rise,.inl,.qbox,.qbg,.toast,.undo,.qcheck svg,.popin{animation:fade .2s ease both!important}.draw,.justdone .dot svg path,.qcheck path{stroke-dasharray:none;stroke-dashoffset:0}}
/* ---------- Sidor ---------- */
.pager{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:8px;margin:0 -12px 6px;
  padding:4px max(12px,calc((100% + 24px - 520px)/2)) 0;
  background:rgba(8,8,11,.62);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}

.wbig b,.pbk{font-family:'EdgeBlock',var(--disp);font-weight:400;letter-spacing:.01em;color:transparent;background:linear-gradient(162deg,#FFFFFF 0%,#F2F1F5 46%,#A4A3AD 54%,#D6D5DC 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #34343C);padding-bottom:2px}

.mlx.pu .pubw{flex:none;margin:2px -4px 0}
.pub{display:block;width:100%;height:auto;overflow:visible}
.pub .lst{cursor:pointer}.pub .lst.nx .lsl{animation:lpulse 1.8s ease-in-out infinite}@keyframes lpulse{50%{opacity:.45}}
.pub.intro .lad,.pub.intro .pload{opacity:0}
.pplt{transform-box:fill-box;transform-origin:50% 0;cursor:pointer}.pplt.pend{opacity:0;pointer-events:none;z-index:1}
.pband{transform-box:fill-box;transform-origin:50% 0;cursor:pointer}
.bands{display:flex;justify-content:center;gap:26px;flex:none}
.bnd{width:52px;height:50px;border-radius:16px;display:grid;place-items:center;transition:transform .1s var(--ease-out),background-color .15s ease}
.bnd svg{width:30px;height:35px}.bnd.on{background:rgba(245,244,247,.1)}.bnd:active{transform:scale(.9)}
.bands.dim{opacity:.3;pointer-events:none;z-index:1}
.pul .bandl{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--tx);line-height:1.2}

.setb .repv{display:block;width:100%;line-height:0;font-size:0}
.repn,.setb .repn,.mlx .setb span.repn{font-family:'EdgeRound',var(--disp);font-weight:600;line-height:1;display:inline-block;white-space:nowrap;transform-origin:50% 0;color:var(--tx);font-size:30px;letter-spacing:0}.setb .repn.dim,.mlx .setb span.repn.dim{color:var(--mu)}
.setb>span{font-family:'EdgeRound',var(--disp);font-weight:500;letter-spacing:.01em}

.setb .rn{display:block;width:100%;max-width:72px;height:auto;margin:2px auto 0;overflow:visible}.setb .rn text{font-family:'EdgeRound',var(--disp);font-weight:500;fill:var(--tx)}.setb .rn.dim text{fill:var(--mu)}
.mlx .setb .repv{flex:1 1 auto;min-height:0;margin:5px 0 10px}.mlx .setb .rn{height:100%;max-width:none;margin:0}
.mlx .setb b.repv{line-height:1}
.pfall{position:fixed;z-index:1;pointer-events:none;will-change:transform}.pfall svg{display:block;width:100%;height:100%}
.mlx.pu .mlstage,.mlx.pu .tray,.mlx.pu .bands,.mlx.pu .mldots,.mlx.pu .mlh{position:relative;z-index:2}
.pfly3{position:fixed;z-index:70;pointer-events:none;transform-origin:center;will-change:transform}
.gv.mlv{overflow:hidden}
.mlin{height:100vh;height:100dvh;box-sizing:border-box;gap:8px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
.ex.mlx{background:none;border-radius:0}
.mlstage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.mlswipe{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:pan-y;will-change:transform}
.mlname{height:44px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 52px}
.mlname b{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more.sm{width:30px;height:30px}.mlh{position:relative;min-height:40px}.mldot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.mla{position:absolute;top:0;z-index:2;width:44px;height:44px;display:grid;place-items:center;color:var(--tx);transition:opacity .2s ease}

function parseMin(s){let m=s.match(/(\d+(?:[.,]\d+)?)\s*(h|tim|timme|timmar)\b/i);if(m)return Math.round(parseFloat(m[1].replace(',','.'))*60);

function addLog(text){
  const t=text.trim();if(!t)return;
  const tk=toks(t);let gid=null,best=0;
  (S.logs||[]).forEach(e=>{const o=toks(e.t),i=o.filter(w=>tk.includes(w)).length,sc=i/Math.max(1,Math.min(o.length,tk.length));
    if(i&&sc>=.5&&sc>best){best=sc;gid=e.gid}});
  S.logs=[{id:newId(),gid:gid||newId(),t,min:parseMin(t),ts:today()},...(S.logs||[])];
}
function groups(){
  const g={};(S.logs||[]).forEach(e=>{const x=g[e.gid]=g[e.gid]||{gid:e.gid,n:0,min:0,t:e.t};x.n++;x.min+=e.min;if(e.t.length<x.t.length)x.t=e.t});
  return Object.values(g).map(x=>({...x,solved:!!(S.gsolved||{})[x.gid]}));
}

function streakDays(){
  let k=today(),n=0;
  if(dayFactor(k)<=1)k=addDays(k,-1);
  while(k>=S.start&&dayFactor(k)>1){n++;k=addDays(k,-1)}
  return n;
}
function bumpBest(){const s=streakDays();if(s>(S.bestStreak||0)){S.bestStreak=s;return true}return false}
function dayFactor(k){const q=answered(k),r=doneCount(k)>=S.goal;return q&&r?1.01:(q||r)?1.005:1}

const sumOf=l=>l.reduce((s,f)=>s+(+f.a||0),0);

function salaryDue(){
  const t=today(),mk=t.slice(0,7),d=+t.slice(8);

const CF_BIG={L:18,R:54,T:14,B:26};
/* Linjen i widgeten och linjen i helskärm är samma objekt: den sträcks ut till sin nya plats och krymper tillbaka vid stängning */
function cfMorph(o,back){
  const cf=ui.cf,w=document.getElementById('cost'),sp=w&&w.querySelector('.cfspark svg'),big=o&&o.querySelector('#cfch svg');
  if(!cf||!sp||!big||RM()||!document.body.animate||cf.p!=='m'||cf.off!==0||cf.side!==ui.cost)return false;
  const vb=big.viewBox.baseVal,sv=sp.viewBox.baseVal,b=big.getBoundingClientRect(),a=sp.getBoundingClientRect();
  if(!vb||!sv||!b.width||!a.width||b.bottom<0||b.top>innerHeight||a.bottom<0||a.top>innerHeight)return false;
  const k=b.width/vb.width,dh=(vb.height-CF_BIG.T-CF_BIG.B)*k,hh=dh*sv.height/(sv.height-8);
  const tgt={left:b.left+CF_BIG.L*k,top:b.top+CF_BIG.T*k-4*hh/sv.height,width:(vb.width-CF_BIG.L-CF_BIG.R)*k,height:hh};
  const src={left:a.left,top:a.top,width:a.width,height:a.height};
  const px=r=>({left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const cl=document.createElement('div');cl.className='cfmorph';
  /* Egna id:n i kopian – annars pekar klippningen på originalet, som är dolt under flygningen */
  const nid='cfm'+(++cfUid);cl.innerHTML=sp.outerHTML.replace(/\b(cf\d+)(?=[gpf]\b)/g,nid);
  Object.assign(cl.style,px(back?tgt:src));document.body.appendChild(cl);
  sp.style.visibility='hidden';big.style.opacity='0';
  const dur=back?380:520;
  cl.animate([px(back?tgt:src),px(back?src:tgt)],{duration:dur,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'}).onfinish=()=>{
    if(back){sp.style.visibility='';cl.remove();return}
    big.style.opacity='';big.animate([{opacity:0},{opacity:1}],{duration:160,easing:'ease-out'});
    cl.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}).onfinish=()=>cl.remove();
    sp.style.visibility=''};
  return true;
}

/* Skalan för 30 d / 1 år – zoomen interpolerar mellan två sådana */
/* Samma högermarginal för båda lägena, så att gröna linjens topp står still under zoomen */
function jYmin(){return Math.min(...curve(),1)*.99}
/* Toppen hamnar alltid på 97 % av höjden – därför står den gröna linjens slutpunkt still när skalan ändras */
function jTop(xmax,yr){const v=curve(),n=v.length-1,ys=[Math.pow(1.01,xmax),1,...v];if(yr>0)ys.push(v[n]*Math.pow(1.01,Math.max(0,xmax-n)));const mn=jYmin();return mn+(Math.max(...ys)-mn)/.97}

  const v=curve(),n=v.length-1,yr=range==='365',xmax=yr?Math.max(365,n):Math.max(30,n);
  return{xmax,R:62,ymax:jTop(xmax,yr?1:0),ymin:jYmin(),yr:yr?1:0,lbl:1};
}
function journeySVG(draw,z,measure){
  const v=curve(),n=v.length-1;z=z||jScale(ui.range);
  const xmax=z.xmax,yrF=z.yr;
  const W=340,H=230,L=8,R=z.R,T=16,B=24;

  const pend=n+(xmax-n)*Math.min(1,yrF),proj=[];if(yrF>0&&pend>n){for(let x=n;x<pend;x++)proj.push([x,v[n]*Math.pow(1.01,x-n)]);proj.push([pend,v[n]*Math.pow(1.01,pend-n)])}
  const ymax=z.ymax,ymin=z.ymin;
  const X=x=>L+(x/xmax)*(W-L-R),Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  const path=f=>{let d='',lx=0;const st=Math.max(1,Math.floor(xmax/120));for(let x=0;x<=xmax;x+=st){d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f(x)).toFixed(1);lx=x}if(lx<xmax)d+='L'+X(xmax).toFixed(1)+' '+Y(f(xmax)).toFixed(1);return d};
  const lid='jl'+(++cfUid);
  /* Etiketterna längs linjerna: i viloläge placeras de i % av linjens längd. Under zoomen glider de rakt
     från startläget till slutläget i sidled (x), så att de bara flyttas så mycket som faktiskt behövs. */
  const f1=x=>Math.pow(1.01,x),f5=x=>Math.pow(1.005,x),f0=()=>1;
  const pts=f=>{const a=[],st=Math.max(1,xmax/180);for(let x=0;x<=xmax;x+=st)a.push([X(x),Y(f(x))]);a.push([X(xmax),Y(f(xmax))]);return a};
  const seg=(a,k)=>Math.hypot(a[k][0]-a[k-1][0],a[k][1]-a[k-1][1]);
  const xAt=(a,pct)=>{let tot=0;for(let k=1;k<a.length;k++)tot+=seg(a,k);let s=0,goal=tot*pct/100;
    for(let k=1;k<a.length;k++){const l=seg(a,k);if(s+l>=goal){const u=l?(goal-s)/l:0;return a[k-1][0]+(a[k][0]-a[k-1][0])*u}s+=l}return a[a.length-1][0]};
  const lenAt=(a,tx)=>{let s=0;for(let k=1;k<a.length;k++){const l=seg(a,k),x0=a[k-1][0],x1=a[k][0];if(x1>=tx)return s+l*Math.max(0,Math.min(1,(tx-x0)/Math.max(1e-6,x1-x0)));s+=l}return s};
  const yrL=yrF>=.5,ahead=Math.min(78,Math.max(50,n/xmax*100+26));
  const OFF={g:yrL?62:ahead,w:yrL?74:ahead,r:yrL?50:ahead};
  if(measure)return{g:xAt(pts(f1),OFF.g),w:xAt(pts(f5),OFF.w),r:xAt(pts(f0),OFF.r)};
  const midLbl=()=>{
    const tp=(i,a,txt,c,k,dy)=>{const off=z.lx?lenAt(a,z.lx[k]).toFixed(1):OFF[k]+'%',d=a.map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
      return `<path id="${lid}${i}" d="${d}" fill="none" stroke="none"/><text font-size="10.5" font-weight="700" font-family="inherit" fill="${c}" letter-spacing=".3" dy="${dy}"><textPath href="#${lid}${i}" xlink:href="#${lid}${i}" startOffset="${off}" text-anchor="middle">${txt}</textPath></text>`};
    const dyR=z.lx?z.lx.dyr:(yrL?14:-6);
    return tp(1,pts(f1),'1 % varje dag','#10D95B','g',-6)+tp(5,pts(f5),'0,5 % varje dag','#F5F4F7','w',-6)
      +tp(0,pts(f0),'0 % varje dag','#FF5B4A','r',dyR.toFixed(1))};
  const you=v.map((y,x)=>(x?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const pj=proj.length?proj.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(''):'';
  const sE=Math.pow(1.01,xmax),hE=Math.pow(1.005,xmax);
  const DC=f=>f>1.009?'#10D95B':f>1?'#F5F4F7':'#FF5B4A';

  for(let j=0;j<n;j++){const c=DC(dayFactor(addDays(S.start,j)));let x0=X(j),y0=Y(v[j]),x1=X(j+1),y1=Y(v[j+1]);
    const len=Math.hypot(x1-x0,y1-y0);if(len>2*GAP+1){const ux=(x1-x0)/len,uy=(y1-y0)/len;x0+=ux*GAP;y0+=uy*GAP;x1-=ux*GAP;y1-=uy*GAP}
    segs+=`<path d="M${x0.toFixed(2)} ${y0.toFixed(2)}L${x1.toFixed(2)} ${y1.toFixed(2)}" stroke="${c}"/>`}
  const tx=X(n),ty=Y(v[n]),cid='jc'+(++cfUid);
  ui.jS={X,Y,v,n,W,xmax,L,R};
  return `<svg viewBox="0 0 ${W} ${H}" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Din resa, dag ${n}. Tryck på en dag för att se den.">
    <defs><clipPath id="${cid}"><rect x="0" y="0" height="${H}" width="${draw?0:W}">${draw?`<animate attributeName="width" from="0" to="${W}" dur="1s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .2 1"/>`:''}</rect></clipPath></defs>
    <path d="${path(x=>Math.pow(1.01,x))}" fill="none" stroke="#10D95B" stroke-width="1.9" stroke-linecap="round"/>
    <path d="${path(x=>Math.pow(1.005,x))}" fill="none" stroke="#F5F4F7" stroke-width="1.9" stroke-linecap="round"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}" stroke="#FF5B4A" stroke-width="1.9"/>
    ${pj?`<path d="${pj}" fill="none" stroke="#F5F4F7" stroke-width="2.25" stroke-dasharray="2 6" stroke-linecap="round"/>`:''}
    <g clip-path="url(#${cid})" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${segs}</g>
    <text x="${W-R+6}" y="${Y(sE)+4}" fill="#10D95B" font-size="11" font-weight="800" font-family="inherit">${pctFmt(sE)}</text>
    <text x="${W-R+6}" y="${Y(hE)+4}" fill="#F5F4F7" font-size="11" font-weight="800" font-family="inherit">${pctFmt(hE)}</text>
    <text x="${W-R+6}" y="${Y(1)+4}" fill="#FF5B4A" font-size="11" font-weight="800" font-family="inherit">0 %</text>
    <g opacity="${z.lbl.toFixed(3)}">${midLbl()}</g>
    <text x="${L}" y="${H-6}" fill="#8E8D98" font-size="11" font-weight="700" font-family="inherit">Dag 1</text>
    <text x="${W-R}" y="${H-6}" fill="#8E8D98" font-size="11" font-weight="700" font-family="inherit" text-anchor="end">Dag ${Math.round(xmax)}</text>
    <g class="jsel" style="opacity:0"><line y1="${T-8}" y2="${H-B}" stroke="#F5F4F7" stroke-width="1" opacity=".5"/><circle r="4" fill="#F5F4F7"/></g>
    <g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)})"><g class="jyou"${draw?' style="animation:fade .3s ease 1.05s both"':''}><circle r="6.5" fill="#F5F4F7"/></g></g>
  </svg>`;
}
/* 30 d <-> 1 år: kameran zoomar ut/in i stället för att rita om. Avbrytbar – nästa zoom startar där den här står. */
function jZoom(to){
  const ch=document.getElementById('jch'),card=document.getElementById('jcard');
  ui.range=to;
  if(card){card.querySelectorAll('[data-act=range]').forEach(x=>x.classList.toggle('on',x.dataset.r===to));const l=document.getElementById('jlbl');if(l)l.innerHTML=jStat()}
  if(!ch)return;cancelAnimationFrame(ui.jzRaf||0);
  if(RM()){ui.jzP=null;ch.innerHTML=journeySVG(false);return}
  /* p = 0 är 30 d, p = 1 är 1 år. Lätt accelererande ut (p = t^2,2); in är exakt samma rörelse baklänges. */
  const out=to==='365',p0=ui.jzP!=null?ui.jzP:(out?0:1),D=650,K=2.2;
  const S0=jScale('30'),S1=jScale('365'),X0=journeySVG(false,S0,true),X1=journeySVG(false,S1,true);
  const t0=performance.now()-(out?Math.pow(p0,1/K):1-Math.pow(p0,1/K))*D;
  const step=now=>{const t=Math.min(1,(now-t0)/D),p=out?Math.pow(t,K):Math.pow(1-t,K);
    if(t>=1){ui.jzP=null;ch.innerHTML=journeySVG(false);return}
    ui.jzP=p;const L=(a,b)=>a+(b-a)*p;
    const xmax=L(S0.xmax,S1.xmax);
    const z={xmax,R:62,ymax:jTop(xmax,p),ymin:L(S0.ymin,S1.ymin),yr:p,lbl:1,lx:{g:L(X0.g,X1.g),w:L(X0.w,X1.w),r:L(X0.r,X1.r),dyr:L(-6,14)}};
    ch.innerHTML=journeySVG(false,z);ui.jzRaf=requestAnimationFrame(step)};
  ui.jzRaf=requestAnimationFrame(step);
}
/* Prickens lyft när dagen blir bättre */
function journeyLift(delay){
  const g=document.querySelector('#jcard .jyou'),s=ui.jS;if(!g||!s)return;
  if(ui.liftHold&&!RM()){const w=ui.jShown;if(w!=null&&s.v[s.n]>w+1e-9)g.style.transform=`translate(0px,${(s.Y(w)-s.Y(s.v[s.n])).toFixed(2)}px)`;return}

/* En dag i resan: svar, påminnelser, effekt */
/* ---------- Uppgifter i efterhand ----------
   En uppgift finns antingen i Att göra (S.rem) eller i Färdiga påminnelser (S.archive). S.doneLog[id] = dagen den blev klar
   och är det som räknas i kurvan, ringen och serien. Funktionerna nedan håller de tre i takt. */
const taskSnap=()=>clone({rem:S.rem,archive:S.archive||[],doneLog:S.doneLog,doneAt:S.doneAt||{}});
const taskRestore=s=>{S.rem=s.rem;S.archive=s.archive;S.doneLog=s.doneLog;S.doneAt=s.doneAt};
/* Klar dag k: idag ligger den kvar avbockad i Att göra, en tidigare dag flyttas den direkt till Färdiga påminnelser */
function taskDone(id,k){
  const t=today();S.doneLog[id]=k;S.doneAt=S.doneAt||{};S.doneAt[id]=k===t?new Date().toISOString():k+'T12:00:00';
  const i=S.rem.findIndex(x=>x.id===id);if(i<0)return;
  if(k<t){const x=S.rem.splice(i,1)[0];S.archive=[{id:x.id,t:x.t,done:k,at:S.doneAt[id]},...(S.archive||[])]}
  else S.rem.push(...S.rem.splice(i,1));
}
/* Inte klar: tillbaka överst i Att göra */
function taskUndone(id){
  delete S.doneLog[id];if(S.doneAt)delete S.doneAt[id];
  const a=S.archive||[],i=a.findIndex(x=>x.id===id);
  if(i>-1){const x=a.splice(i,1)[0];S.rem.unshift({id:x.id,t:x.t})}
  else{const j=S.rem.findIndex(x=>x.id===id);if(j>-1)S.rem.unshift(...S.rem.splice(j,1))}
}
function taskAdd(k,txt){const id=newId();S.rem.push({id,t:txt});taskDone(id,k);return id}
function taskText(id,txt){const x=S.rem.find(r=>r.id===id)||(S.archive||[]).find(r=>r.id===id);if(x)x.t=txt}
function taskDel(id){S.rem=S.rem.filter(x=>x.id!==id);S.archive=(S.archive||[]).filter(x=>x.id!==id);delete S.doneLog[id];if(S.doneAt)delete S.doneAt[id]}

/* En dag i resan: effekt, uppgifter (klara + ogjorda), svar */

/* ---- Ringen: två halvor, frågor och påminnelser ---- */
function arcD(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];const[x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${Math.abs(a1-a0)>180?1:0} ${a1>a0?1:0} ${x1.toFixed(2)} ${y1.toFixed(2)}`}
/* Gröna ljuset stiger med hur mycket av dagen som är klart: frågorna är ena halvan, påminnelserna den andra */
function eGlow(p){
  if(p<=0)return PAL.dim+';--gh:130px;--ga:1';if(p>=1)return PAL.green+';--gh:130px;--ga:1';

function eGlowSet(el,p){eGlow(p).split(';').forEach(s=>{const i=s.indexOf(':');if(i>0)el.style.setProperty(s.slice(0,i).trim(),s.slice(i+1).trim())})}
function edgeCard(){

  const p0=(sh.q+sh.r)/2,p1=((q?1:0)+rf)/2;

/* Kör ringens fyllnad efter render och lyft på resan när ringen sluts */
function ringSync(){

  const fly=ui.ringFly||0;ui.ringFly=0;

    {const ec=document.getElementById('edgecard');if(ec&&!ec.classList.contains('lit'))eGlowSet(ec,(q+r)/2)}

/* En liten prick flyger från påminnelsen in i ringens högra halva */

  choiceG=g;const r=g.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.62;

  c.style.left=left+'px';c.style.top=cy+'px';c.style.transformOrigin=`${cx-left}px 0px`;
  document.body.append(s,c);

  c.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;closeChoice(false);openCat(b.dataset.c,g)};
  if(!RM())c.animate([{opacity:0,transform:'scale(.55)'},{opacity:1,transform:'none'}],{duration:340,easing:'cubic-bezier(.32,.72,0,1)'});

function closeChoice(cancel){
  const c=document.querySelector('.gchoice'),s=document.querySelector('.gscrim');if(s)s.remove();if(!c)return;

function springTo(st,to,o,onF,onDone){
  cancelAnimationFrame(st.raf);st.raf=0;
  if(RM()){st.x=to;st.v=0;onF(to);onDone&&onDone();return}
  const w=2*Math.PI/(o.response||.4),k=w*w,c=2*(o.damping==null?1:o.damping)*w;let last=performance.now();
  const f=now=>{const dt=Math.min(.064,Math.max(0,(now-last)/1000));last=now;
    const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
    for(let i=0;i<n;i++){const a=-k*(st.x-to)-c*st.v;st.v+=a*h;st.x+=st.v*h}
    if(Math.abs(st.x-to)<.08&&Math.abs(st.v)<2){st.x=to;st.v=0;st.raf=0;onF(to);onDone&&onDone();return}
    onF(st.x);st.raf=requestAnimationFrame(f)};
  st.raf=requestAnimationFrame(f);
}

const project=(v,d=.998)=>(v/1000)*d/(1-d);

function bsheet(html,onMount,style){
  document.querySelectorAll('.bso').forEach(x=>x.remove());
  const o=document.createElement('div');o.className='bso';
  o.innerHTML=`<div class="scrim"></div><div class="bs" role="dialog" aria-modal="true" style="${style||''}"><div class="grab" aria-hidden="true"><i></i></div>${html}</div>`;
  document.body.appendChild(o);
  const bs=o.querySelector('.bs'),st={x:0,v:0,raf:0},set=y=>{bs.style.transform=`translate3d(0,${y.toFixed(2)}px,0)`};
  st.x=bs.offsetHeight+30;set(st.x);
  requestAnimationFrame(()=>{o.classList.add('on');springTo(st,0,{damping:1,response:.38},set)});
  let closed=false;
  o.close=cb=>{if(closed)return;closed=true;o.classList.remove('on');springTo(st,bs.offsetHeight+30,{damping:1,response:.3},set,()=>{o.remove();cb&&cb()})};
  o.querySelector('.scrim').addEventListener('click',()=>o.close());
  let d=null;
  bs.addEventListener('pointerdown',e=>{if(!e.target.closest('.grab,h3'))return;d={y0:e.clientY,x0:st.x,s:[]};cancelAnimationFrame(st.raf);st.raf=0;try{bs.setPointerCapture(e.pointerId)}catch(_){}pushS(d.s,e)});
  bs.addEventListener('pointermove',e=>{if(!d)return;pushS(d.s,e);let y=d.x0+e.clientY-d.y0;if(y<0)y=-rubber(-y,240);st.x=y;set(y)});
  const end=()=>{if(!d)return;const v=velOf(d.s).y;d=null;st.v=v;if(st.x+project(v,.99)>bs.offsetHeight*.33)o.close();else springTo(st,0,{damping:1,response:.35},set)};
  bs.addEventListener('pointerup',end);bs.addEventListener('pointercancel',end);
  onMount&&onMount(bs,o);

}

  });

    if(prPress){const p=prPress;prPress=null;clearTimeout(p.t);p.r.classList.remove('press','hold');if(!p.fired&&e.type==='pointerup'){const y=addDays(today(),-1);if(p.k===y&&ui.pday!=='y'){const q=PR.list.find(x=>x.id===p.r.dataset.pid);if(!q)return;if(!canEditDay(y)){gToast('Igår är låst');return}const on=!isChk(q,y);setChk(q,y,on);if(on)vib(8);renderPr()}else prToggle(p.r.dataset.pid)}}

    else if(a==='hnext')prShift(1,0);

  });
}

function dragStart(h,y){const sw=h.parentNode,list=[...document.querySelectorAll('#app .swipe[data-id]')].filter(el=>!S.doneLog[el.dataset.id]),from=list.indexOf(sw);if(from<0)return null;

function dragMove(){const r=rd;if(!r)return;const dy=r.cy+scrollY-r.y0;r.sw.style.transform=`translate3d(0,${dy.toFixed(1)}px,0) scale(1.03)`;

<script>
/* Squircle-motor: ersätter border-radius med Apple-lika kontinuerliga hörn (corner smoothing .6).
   Klipper varje ruta med clip-path:path() och ritar kantglöden som SVG så att den följer formen. */
(function(){
  if(!(window.CSS&&CSS.supports&&CSS.supports('clip-path','path("M0 0H1V1Z")'))||!window.ResizeObserver)return;
  var SEL='.hero,.card,.mcard,.cost,.cfc,.cfs,.cfr,.inl,.swipe,.habit,.clearbtn,.grp,.tl,.qbox,.ex,.gform,.lad,.pbr,.bwc,.bwch,.bwh,.gadd,.left,.warnbar,.tabs button,.btn,.gchoice button,.gin,.setc,.raise,.gdel,.bwsave,.qnav button,.fx button,.dlg .cap button,input,textarea';
  var SMOOTH=.6, cache=new Map(), seen=new WeakMap();
  var RIM={
    lit:[[0,1.5,.4],[18,1,.34],[42,6,.2],[84,20,.11]],
    glow:[[0,1,.17],[14,1,.18],[34,4,.13],[74,18,.08]],
    bloom:[[0,1,.15],[16,2,.14]],
    hero:[[0,1,.2],[16,2,.17],[44,9,.1]],
    focus:[[0,2,1,'#3E7BFF']]
  };
  document.documentElement.classList.add('sq');
  function rad(d){return d*Math.PI/180}
  function f(n){return Math.round(n*100)/100}
  // Figma-/iOS-algoritmen för utjämnade hörn
  function path(w,h,R,ox,oy){
    ox=ox||0;oy=oy||0;
    var budget=Math.min(w,h)/2;R=Math.min(R,budget);
    if(R<=0)return 'M'+ox+' '+oy+'h'+w+'v'+h+'h'+(-w)+'Z';
    var s=SMOOTH,p=(1+s)*R;
    if(p>budget){s=Math.max(0,Math.min(s,budget/R-1));p=Math.min(p,budget)}
    var arcM=90*(1-s),arc=Math.sin(rad(arcM/2))*R*Math.SQRT2,al=(90-arcM)/2,
        p34=R*Math.tan(rad(al/2)),be=45*s,c=p34*Math.cos(rad(be)),d=c*Math.tan(rad(be)),
        b=(p-arc-c-d)/3,a=2*b;
    a=f(a);b=f(b);c=f(c);d=f(d);arc=f(arc);R=f(R);p=f(p);
    var ab=f(a+b),abc=f(a+b+c),bc=f(b+c);
    return 'M'+f(ox+w-p)+' '+f(oy)+
      'c'+a+' 0 '+ab+' 0 '+abc+' '+d+'a'+R+' '+R+' 0 0 1 '+arc+' '+arc+'c'+d+' '+c+' '+d+' '+bc+' '+d+' '+abc+
      'L'+f(ox+w)+' '+f(oy+h-p)+
      'c0 '+a+' 0 '+ab+' '+(-d)+' '+abc+'a'+R+' '+R+' 0 0 1 '+(-arc)+' '+arc+'c'+(-c)+' '+d+' '+(-bc)+' '+d+' '+(-abc)+' '+d+
      'L'+f(ox+p)+' '+f(oy+h)+
      'c'+(-a)+' 0 '+(-ab)+' 0 '+(-abc)+' '+(-d)+'a'+R+' '+R+' 0 0 1 '+(-arc)+' '+(-arc)+'c'+(-d)+' '+(-c)+' '+(-d)+' '+(-bc)+' '+(-d)+' '+(-abc)+
      'L'+f(ox)+' '+f(oy+p)+
      'c0 '+(-a)+' 0 '+(-ab)+' '+d+' '+(-abc)+'a'+R+' '+R+' 0 0 1 '+arc+' '+(-arc)+'c'+c+' '+(-d)+' '+bc+' '+(-d)+' '+abc+' '+(-d)+'Z';
  }
  function svgUrl(w,h,body){
    var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+body+'</svg>';
    return 'url("data:image/svg+xml,'+encodeURIComponent(s).replace(/'/g,'%27')+'")';
  }
  // Inset-skugga = (stor rektangel minus inkrympt squircle), suddad. Elementets clip-path tar bort allt utanför.
  function rim(w,h,R,layers){
    var defs='',g='';
    layers.forEach(function(L,i){
      var bl=L[0],sp=L[1],al=L[2],col=L[3]||'#fff',m=bl*2+4;
      var inner=path(w-2*sp,h-2*sp,Math.max(0,R-sp),sp,sp);
      var outer='M'+(-m)+' '+(-m)+'H'+(w+m)+'V'+(h+m)+'H'+(-m)+'Z';
      var fl='';
      if(bl>0){defs+='<filter id="b'+i+'" filterUnits="userSpaceOnUse" x="'+(-m)+'" y="'+(-m)+'" width="'+(w+2*m)+'" height="'+(h+2*m)+'"><feGaussianBlur stdDeviation="'+(bl/2)+'"/></filter>';fl=' filter="url(#b'+i+')"'}
      g+='<path fill-rule="evenodd" fill="'+col+'" fill-opacity="'+al+'"'+fl+' d="'+outer+inner+'"/>';
    });
    return svgUrl(w,h,'<defs>'+defs+'</defs>'+g);
  }
  function ring(w,h,R,t){
    return svgUrl(w,h,'<path fill-rule="evenodd" d="'+path(w,h,R)+path(w-2*t,h-2*t,Math.max(0,R-t),t,t)+'"/>');
  }
  function preset(el){
    var k=el.classList;
    if(k.contains('hero'))return 'hero';
    if(k.contains('edgecard')&&k.contains('lit'))return 'lit';
    if(k.contains('edgecard')&&k.contains('glow'))return 'glow';
    if(k.contains('bloom'))return 'bloom';
    if((k.contains('gin')||k.contains('setc'))&&el.matches(':focus-within'))return 'focus';
    return '';
  }
  function apply(el,w,h){
    if(el.classList.contains('del'))return;
    var st=seen.get(el)||{};
    if(w==null){w=st.w;h=st.h}
    if(!w||!h)return;
    var R=st.R;
    if(R==null){
      var cs=getComputedStyle(el);
      R=parseFloat(cs.borderTopLeftRadius)||0;
      if(String(cs.borderTopLeftRadius).indexOf('%')>-1)R=0;
      st.R=R;
    }
    w=Math.round(w*2)/2;h=Math.round(h*2)/2;
    var pr=preset(el),q=el.classList.contains('qbox');
    var key=w+'|'+h+'|'+R+'|'+pr+'|'+q;
    st.w=w;st.h=h;seen.set(el,st);
    if(st.key===key)return;st.key=key;
    // Piller och cirklar (radie ≥ halva kortsidan) lämnas orörda
    if(R<10||R>=Math.min(w,h)/2-.5){el.style.removeProperty('clip-path');el.style.removeProperty('--sq-rim');el.style.removeProperty('--sq-ring');return}
    var c=cache.get(key);
    if(!c){
      c={clip:'path("'+path(w,h,R)+'")',rim:pr?rim(w,h,R,RIM[pr]):'',ring:q?ring(w,h,R,3):''};
      if(cache.size>400)cache.clear();
      cache.set(key,c);
    }
    el.style.clipPath=c.clip;el.style.webkitClipPath=c.clip;
    if(c.rim)el.style.setProperty('--sq-rim',c.rim);else el.style.removeProperty('--sq-rim');
    if(c.ring)el.style.setProperty('--sq-ring',c.ring);else el.style.removeProperty('--sq-ring');
  }
  var ro=new ResizeObserver(function(es){
    es.forEach(function(e){
      var bb=e.borderBoxSize&&(e.borderBoxSize[0]||e.borderBoxSize);
      var w=bb&&bb.inlineSize!=null?bb.inlineSize:e.target.offsetWidth,h=bb&&bb.blockSize!=null?bb.blockSize:e.target.offsetHeight;
      apply(e.target,w,h);
    });
  });
  function take(root){
    if(root.nodeType!==1)return;
    if(root.matches(SEL)&&!seen.has(root)){seen.set(root,{});ro.observe(root)}
    var l=root.querySelectorAll(SEL);
    for(var i=0;i<l.length;i++)if(!seen.has(l[i])){seen.set(l[i],{});ro.observe(l[i])}
  }
  take(document.body);
  new MutationObserver(function(ms){
    ms.forEach(function(m){
      if(m.type==='childList')m.addedNodes.forEach(take);
      else if(m.type==='attributes'&&seen.has(m.target)){var st=seen.get(m.target);st.R=null;apply(m.target)}
    });
  }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  function foc(e){var t=e.target&&e.target.closest&&e.target.closest('.gin,.setc');if(t)setTimeout(function(){apply(t)},0)}
  document.addEventListener('focusin',foc);document.addEventListener('focusout',foc);
})();
</script>
