<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB;
  --green:#2FD27B;--red:#FF5B4A;--teal:#22D3C5;--violet:#9B6BFF;--amber:#FFB81C;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --ser:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB}}
:root[data-theme="dark"]{--bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none;font-optical-sizing:auto}
button,[role="button"],.chip,.mini,.tl{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.swipe>.habit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lbl,.st,.sm,.mu,.legend span,.chip,.lbl2,.qmeta,.qlater,.hero-q span,.edge,.frow,.due,.warn{letter-spacing:.01em}
.h2,.cost .ttl{letter-spacing:-.025em}
.qstage{overscroll-behavior:contain}
html,body{background:var(--bg);color:var(--tx);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{padding:12px 12px 56px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:0;border-radius:14px;padding:12px 14px;width:100%;outline:none}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:#75747E}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* Hero */
.hero{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:3/4;max-height:560px;width:100%;background:var(--s1)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,31,35,.6) 0%,rgba(31,31,35,0) 26%,rgba(31,31,35,.15) 48%,rgba(31,31,35,.97) 100%)}
.hero-top{position:absolute;z-index:2;top:16px;left:18px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top .d{font-weight:700;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.hero-q{position:absolute;z-index:2;left:22px;right:22px;bottom:24px}
.hero-q p{font-family:var(--ser);font-style:italic;font-size:clamp(27px,7.4vw,36px);line-height:1.12;letter-spacing:-.01em}
.hero-q span{display:block;margin-top:12px;color:var(--mu);font-size:14px;font-weight:700}

/* Cards */
.card{background:var(--s1);border-radius:26px;padding:20px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu)}

.north{background:var(--violet);color:var(--bg);text-align:left;width:100%}
.north .big{font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.north .sub{margin-top:14px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:999px;background:rgba(16,13,24,.22);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--bg)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;border-radius:24px;padding:18px 16px;background:var(--s1);display:flex;flex-direction:column;gap:4px;min-height:132px}
.mcard .lbl{font-size:13px;font-weight:700}
.mcard .amt{font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:-.03em;margin-top:auto}
.mcard .sm{font-size:12px;color:var(--mu);font-weight:600}

/* Habits */
.today-h{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;opacity:.25}
.dots i.on{opacity:1}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--s1);border-radius:24px;padding:16px;transition:background-color .18s ease,color .18s ease,transform .1s ease}
.habit:active{transform:scale(.985)}
.habit .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.habit .dot svg{opacity:0;transition:opacity .15s}
.habit .mid{min-width:0;flex:1}
.habit .area{font-size:13px;font-weight:800}
.habit .txt{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px}
.habit .warn{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit .stk{text-align:right;flex:none}
.habit .stk b{display:block;font-size:24px;font-weight:800;line-height:1}

const toks=s=>s.toLowerCase().replace(/[^a-zå-ö0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!/^\d+$/.test(w)&&!STOP.includes(w));
function parseMin(s){let m=s.match(/(\d+(?:[.,]\d+)?)\s*(h|tim|timme|timmar)\b/i);if(m)return Math.round(parseFloat(m[1].replace(',','.'))*60);

function addLog(text){
  const t=text.trim();if(!t)return;
  const tk=toks(t);let gid=null,best=0;
  (S.logs||[]).forEach(e=>{const o=toks(e.t),i=o.filter(w=>tk.includes(w)).length,sc=i/Math.max(1,Math.min(o.length,tk.length));
    if(i&&sc>=.5&&sc>best){best=sc;gid=e.gid}});
  S.logs=[{id:newId(),gid:gid||newId(),t,min:parseMin(t),ts:today()},...(S.logs||[])];
}

  const g={};(S.logs||[]).forEach(e=>{const x=g[e.gid]=g[e.gid]||{gid:e.gid,n:0,min:0,t:e.t};x.n++;x.min+=e.min;if(e.t.length<x.t.length)x.t=e.t});
  return Object.values(g).map(x=>({...x,solved:!!(S.gsolved||{})[x.gid]}));
}

    const peak=1.05+R()*.4,rot=dir*(10+R()*28),dur=620+R()*300,N=10,kf=[];

function goalChart(){
  const ms=months();while(ms.length<4)ms.push(addDays(ms[ms.length-1]+'-01',32).slice(0,7));
  const cur=today().slice(0,7),curRev=revOf(cur);
  const W=300,H=240,L=30,R=8,T=16,B=12,split=L+(W-L-R)*.62;
  const lo=500,hi=260000,lg=Math.log10;
  const Y=v=>T+(1-(lg(Math.max(lo,v))-lg(lo))/(lg(hi)-lg(lo)))*(H-T-B);
  const X=i=>L+(i/ms.length)*(split-L-6);
  const step=f=>{let d='',prev=null;ms.forEach((m,i)=>{if(m>cur)return;const v=f(m);if(!v){prev=null;return}
    const y=Y(v).toFixed(1);d+=(prev===null?'M':'L')+X(i).toFixed(1)+' '+y+'L'+X(i+1).toFixed(1)+' '+y;prev=v});return d};
  const path=(f,c)=>{const d=step(f);return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''};
  const flat=(v,c,t,below)=>v?`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="3" stroke-linecap="round"${ui.drawNow?' pathLength="1" class="draw"':''}/>`:'';
  const next=GOALS.find(x=>x>curRev);
  const grid=[1000,10000,100000].map(v=>`<line x1="${L}" x2="${split}" y1="${Y(v)}" y2="${Y(v)}" stroke="#34343B" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3.5}" fill="#A2A1AB" font-size="9.5" font-weight="700" font-family="inherit" text-anchor="end">${krK(v)}</text>`).join('');
  const zx=i=>split+14+i*((W-R-split-26)/(GOALS.length-1));
  const dots=GOALS.map((v,i)=>{const ok=curRev>=v,x=zx(i),y=Y(v);
    return `<circle cx="${x}" cy="${y}" r="${v===GOAL?7:5.5}" fill="${ok?'#2FD27B':'#F5F4F7'}"${ui.drawNow?` class="popin" style="animation-delay:${.35+i*.07}s"`:''}/>
    <text x="${x-9}" y="${y+3.5}" fill="${ok?'#2FD27B':'#F5F4F7'}" font-size="10" font-weight="800" font-family="inherit" text-anchor="end">${v===GOAL?'Lön från AB':krK(v)}</text>`}).join('');
  const nl=next?`<line x1="${L}" x2="${zx(GOALS.indexOf(next))}" y1="${Y(next)}" y2="${Y(next)}" stroke="#F5F4F7" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>`:'';
  const mlab=ms.map((m,i)=>(i===0||m===cur||i===ms.length-1)?`<text x="${(X(i)+X(i+1))/2}" y="${H-6}" fill="${m===cur?'#F5F4F7':'#A2A1AB'}" font-size="10" font-weight="700" font-family="inherit" text-anchor="middle">${MON[+m.slice(5)-1].slice(0,3)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Omsättning och lön per månad mot målen">
    ${curRev?`<rect x="${L}" y="${Y(curRev)}" width="${W-R-L}" height="${Math.max(0,H-B-Y(curRev))}" fill="#9B6BFF" opacity=".16"${ui.drawNow?' class="fadein"':''}/>`:''}${grid}${nl}${flat(salOf(cur),'#22D3C5','Din lön',salOf(cur)<curRev&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${flat(curRev,'#9B6BFF','Omsättning',curRev<=salOf(cur)&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${dots}</svg>`;
}
function chart(){

  const rate=Math.pow(v[n],1/n);
  const proj=[];if(ui.range==='365'){for(let x=n;x<=xmax;x++)proj.push([x,v[n]*Math.pow(rate,x-n)])}
  const vis=v.slice(0,xmax+1);
  const ys=[2,Math.pow(1.01,xmax),Math.pow(.99,xmax),...vis,...proj.map(p=>p[1])];
  const ymax=Math.max(...ys)*1.04,ymin=Math.min(...ys,1)*(ui.range==='30'?.98:1);
  const X=x=>L+(x/xmax)*(W-L-R), Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  const path=f=>{let d='';const st=Math.max(1,Math.floor(xmax/120));for(let x=0;x<=xmax;x+=st)d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f(x)).toFixed(1);d+='L'+X(xmax).toFixed(1)+' '+Y(f(xmax)).toFixed(1);return d};
  const you=vis.map((y,x)=>(x?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const pj=proj.length?proj.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(''):'';
  const sE=Math.pow(1.01,xmax),fE=Math.pow(.99,xmax);
  const lbl=y=>'×'+(y>=10?dec(y,0):dec(y,2));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva över din utveckling jämfört med success- och failure-kurvan">
    <line x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}" stroke="#45454D" stroke-width="1.5" stroke-dasharray="3 5"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(2)}" y2="${Y(2)}" stroke="${v[n]>=2?'#2FD27B':'#F5F4F7'}" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>
    <text x="${X(Math.min(70,xmax))<(W-R)/2?X(Math.min(70,xmax))+10:L}" y="${Y(2)-(X(Math.min(70,xmax))<(W-R)/2?12:8)}" fill="${v[n]>=2?'#2FD27B':'#F5F4F7'}" font-size="11" font-weight="800" font-family="inherit">100 % bättre${v[n]>=2?', nått':''}</text>
    <path d="${path(x=>Math.pow(1.01,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#2FD27B" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <path d="${path(x=>Math.pow(.99,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#FF5B4A" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    ${pj?`<path d="${pj}" fill="none" stroke="#F5F4F7" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" opacity=".6"/>`:''}
    <path d="${you}"${ui.drawNow?' pathLength="1" class="draw" style="animation-delay:.3s"':''} fill="none" stroke="#F5F4F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(Math.min(70,xmax))}" cy="${Y(2)}" r="6.5" fill="${v[n]>=2?'#2FD27B':'#F5F4F7'}"${ui.drawNow?' class="popin" style="animation-delay:.9s"':''}/>
    <circle cx="${X(n)}" cy="${Y(v[n])}" r="5.5" fill="#F5F4F7"${ui.drawNow?' class="popin" style="animation-delay:1.1s"':''}/>
    <text x="${W-R+6}" y="${Y(sE)+4}" fill="#2FD27B" font-size="12" font-weight="800" font-family="inherit">${lbl(sE)}</text>
    <text x="${W-R+6}" y="${Math.min(H-B,Y(fE)+4)}" fill="#FF5B4A" font-size="12" font-weight="800" font-family="inherit">${lbl(fE)}</text>
    <text x="${L}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit">Dag 1</text>
    <text x="${W-R}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit" text-anchor="end">Dag ${xmax}</text>
  </svg>`;
}

function renderGym(){

/* ---------- tryck på figuren ---------- */
let gPress=null,gBusy=false;
function gOn(g,on){document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.toggle('on',on))}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g)return;document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.add('hov'))});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g)return;const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#gym [data-part]');if(to&&to.dataset.part===g.dataset.part)return;document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.remove('hov'))});
function gCommit(g){
  if(gBusy)return;gBusy=true;gOn(g,true);
  const k=g.dataset.part;
  setTimeout(()=>{if(k==='chest')showChoice(g);else openCat(k,g)},RM()?0:170);
}
function gCancel(){if(gPress){gOn(gPress.g,false);gPress=null}}
const gymEl=()=>document.getElementById('gym');
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g||gBusy||e.button>0)return;gPress={g,x:e.clientX,y:e.clientY};gOn(g,true)});
document.addEventListener('pointermove',e=>{if(gPress&&Math.hypot(e.clientX-gPress.x,e.clientY-gPress.y)>10)gCancel()});
document.addEventListener('pointerup',e=>{if(!gPress)return;const p=gPress;gPress=null;
  const hit=document.elementFromPoint(e.clientX,e.clientY),h=hit&&hit.closest('[data-part]');
  if(h&&h.dataset.part===p.g.dataset.part)gCommit(p.g);else gOn(p.g,false)});
document.addEventListener('pointercancel',gCancel);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.querySelector('.gchoice'))closeChoice(true);else if(document.getElementById('gv'))closeCat();return}
  const g=e.target.closest&&e.target.closest('#gym [data-part]');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gCommit(g)}
});

/* ---------- bröst eller rygg ---------- */
let choiceG=null;
function showChoice(g){
  choiceG=g;const r=g.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.62;
  const s=document.createElement('div');s.className='gscrim';
  const c=document.createElement('div');c.className='gchoice';c.setAttribute('role','dialog');c.setAttribute('aria-label','Bröst eller rygg');
  c.innerHTML=`<button data-c="chest">Bröst</button><button data-c="back">Rygg</button>`;
  const left=Math.max(12,Math.min(innerWidth-264,cx-126));
  c.style.left=left+'px';c.style.top=cy+'px';c.style.transformOrigin=`${cx-left}px 0px`;
  document.body.append(s,c);
  s.onclick=()=>closeChoice(true);
  c.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;closeChoice(false);openCat(b.dataset.c,g)};
  if(!RM())c.animate([{opacity:0,transform:'scale(.55)'},{opacity:1,transform:'none'}],{duration:340,easing:'cubic-bezier(.32,.72,0,1)'});
  c.querySelector('button').focus({preventScroll:true});
}
function closeChoice(cancel){
  const c=document.querySelector('.gchoice'),s=document.querySelector('.gscrim');if(s)s.remove();if(!c)return;
  if(cancel){gBusy=false;if(choiceG)gOn(choiceG,false)}
  if(RM()||!cancel){c.remove();return}
  c.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.6)'}],{duration:180,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).onfinish=()=>c.remove();
}

/* ---------- kategorivy ---------- */
function openCat(cat,g){
  const r=g.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
  ui.gv={cat,part:g.dataset.part};ui.gform=null;ui.openEx=ui.openEx||{};
  const o=document.createElement('div');o.className='gv';o.id='gv';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',CATS[cat]);
  document.body.appendChild(o);document.body.style.overflow='hidden';
  gvRender();bindGv(o);gBusy=false;
  const bk=o.querySelector('.gback');if(bk)bk.focus({preventScroll:true});
  if(RM()){o.animate([{opacity:0},{opacity:1}],{duration:200});return}
  const R=Math.hypot(Math.max(ox,innerWidth-ox),Math.max(oy,innerHeight-oy)),col=cat==='pb'?'#FFB81C':GB;
  o.animate([{clipPath:`circle(18px at ${ox}px ${oy}px)`,backgroundColor:col},{backgroundColor:'#1F1F23',offset:.55},{clipPath:`circle(${R}px at ${ox}px ${oy}px)`,backgroundColor:'#1F1F23'}],{duration:520,easing:'cubic-bezier(.32,.72,0,1)'});
  const inn=o.querySelector('.gvin');if(inn)inn.animate([{opacity:0,transform:'translateY(16px) scale(.98)'},{opacity:1,transform:'none'}],{duration:420,delay:110,easing:'cubic-bezier(.23,1,.32,1)',fill:'backwards'});
}
function closeCat(){
  const o=document.getElementById('gv');if(!o||o.dataset.closing)return;o.dataset.closing='1';

  if(RM()||!g){o.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}).onfinish=fin;return}
  const r=g.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2,R=Math.hypot(Math.max(ox,innerWidth-ox),Math.max(oy,innerHeight-oy));

function lastLog(id){
  const t=today();const ks=Object.keys(L).filter(k=>k<t&&L[k][id]&&(L[k][id].r||[]).some(x=>x!=null)).sort();
  const k=ks[ks.length-1];return k?{d:k,...L[k][id]}:null;
}
function recOf(e){
  const cur=(L[today()]||{})[e.id];const src=cur&&cur.r&&cur.r[0]!=null?cur:lastLog(e.id);
  if(!src||src.r[0]==null||src.r[0]<e.thr||e.w>src.w)return null;return src;
}

  return `<div class="ex open" data-id="${e.id}"><button class="exh" data-g="toggle" aria-expanded="true">${esc(e.name)}</button>
  <div class="exb"><div class="exm"><span>${e.sets} set, threshold ${e.thr} reps, steg ${fmtKg(e.step)} kg</span><button class="more" data-g="editex" aria-label="Redigera ${esc(e.name)}">${DOTS}</button></div>
  <label class="gin"><span>Vikt</span><input data-gw inputmode="decimal" value="${e.w?fmtKg(e.w):''}" placeholder="0" autocomplete="off" enterkeyhint="next"><em>kg</em></label>
  <div class="sets" style="grid-template-columns:repeat(${Math.min(e.sets,4)},1fr)">${sets}</div>
  <div class="last">${last?`Förra passet ${dlabel(last.d)}: ${last.r.map(x=>x==null?'–':x).join(', ')} reps på ${fmtKg(last.w)} kg`:'Första passet. Varje set sparas direkt när du skriver.'}</div>
  <div class="recw">${recHTML(e)}</div></div></div>`;
}
function exForm(e,cat){
  return `<div class="gform" data-form="ex"><h3>${e?'Redigera övning':'Ny övning'}</h3>
  <div class="fld"><span>Namn</span><input data-f="name" value="${e?esc(e.name):''}" placeholder="${cat==='onearm'?'t.ex. Viktade chins':cat==='marklyft'?'t.ex. Marklyft':'t.ex. Bänkpress'}" autocomplete="off" enterkeyhint="next"></div>
  <div class="two"><div class="fld"><span>Vikt kg</span><input data-f="w" inputmode="decimal" value="${e&&e.w?fmtKg(e.w):''}" placeholder="0"></div>
  <div class="fld"><span>Set</span><input data-f="sets" inputmode="numeric" value="${e?e.sets:3}"></div></div>
  <div class="two"><div class="fld"><span>Threshold reps</span><input data-f="thr" inputmode="numeric" value="${e?e.thr:8}"></div>
  <div class="fld"><span>Viktsteg kg</span><input data-f="step" inputmode="decimal" value="${e?fmtKg(e.step):'2,5'}"></div></div>
  <div class="acts"><button class="btn" data-g="fcancel">Avbryt</button><button class="btn fill" data-g="fsave" style="background:${GB};color:#fff">${e?'Spara ändringar':'Lägg till'}</button></div>
  ${e?'<button class="gdel" data-g="fdel">Ta bort övning</button>':''}</div>`;
}
function exListHTML(cat){
  const list=G.ex.filter(e=>e.cat===cat),f=ui.gform&&ui.gform.k==='ex'?ui.gform:null;let h='';
  list.forEach(e=>{h+=f&&f.id===e.id?exForm(e,cat):exCard(e)});
  if(f&&!f.id)h+=exForm(null,cat);
  else{if(!list.length)h+=`<p class="gempty">Inga övningar än.</p>`;h+=`<button class="gadd" data-g="addex">Lägg till övning</button>`}
  return h;
}
function ladderHTML(){
  const d=LADDER.filter(([k])=>G.ladder[k]).length,nx=LADDER.find(([k])=>!G.ladder[k]);
  return `<section class="lad"><div class="row"><h3>Trappan</h3><span class="mu" style="font-weight:700;font-size:14px">${d} av ${LADDER.length}</span></div>
  <div class="bar"><i style="width:${d/LADDER.length*100}%"></i></div>
  ${LADDER.map(([k,t])=>{const on=G.ladder[k],isN=nx&&nx[0]===k;
    return `<button class="step${on?' done':''}${isN?' next':''}" data-g="step" data-k="${k}" aria-pressed="${!!on}"><span class="ck">${CHECK}</span><b>${t}</b>${on?`<small>${dlabel(on)}</small>`:isN?'<small class="nx">Nästa</small>':''}</button>`}).join('')}</section>`;
}
/* personbästa */
function pbForm(p){
  return `<div class="gform" data-form="pb"><h3>${p?'Redigera PB':'Nytt PB'}</h3>
  <div class="two"><div class="fld"><span>Lyft</span><input data-f="n" value="${esc(p?p.n:'Marklyft')}" autocomplete="off"></div>
  <div class="fld"><span>Kg, 1 rep</span><input data-f="kg" inputmode="decimal" value="${p?fmtKg(p.kg):''}" placeholder="0"></div></div>
  <div class="acts"><button class="btn" data-g="fcancel">Avbryt</button><button class="btn fill" data-g="pbsave" style="background:#FFB81C;color:#1F1F23">${p?'Spara ändringar':'Spara PB'}</button></div>
  ${p?'<button class="gdel" data-g="pbdel">Ta bort PB</button>':''}</div>`;
}
function pbHTML(){
  const f=ui.gform&&ui.gform.k==='pb'?ui.gform:null,best={};
  G.pb.forEach(p=>{const k=p.n.toLowerCase();if(!best[k]||p.kg>best[k].kg)best[k]=p});
  const list=[...G.pb].sort((a,b)=>b.d.localeCompare(a.d)||b.kg-a.kg);let h='';
  if(f&&!f.id)h+=pbForm(null);
  list.forEach(p=>{h+=f&&f.id===p.id?pbForm(p):`<button class="pbr${best[p.n.toLowerCase()]===p?'':' old'}" data-g="editpb" data-id="${p.id}"><span><b>${esc(p.n)}</b><small>${dlabel(p.d,true)}</small></span><span class="pbk">${fmtKg(p.kg)} kg</span></button>`});
  if(!f||f.id){if(!list.length)h+=`<p class="gempty">Inga rekord än.</p>`;h+=`<button class="gadd" data-g="addpb" style="color:#FFB81C">Lägg till PB</button>`}
  return h;
}
/* kroppsvikt */
function bwChart(ks){
  if(ks.length<2)return `<p class="mu" style="font-size:14px;font-weight:600;margin-top:10px">Linjen ritas när du har vägt dig två dagar.</p>`;
  const W=320,H=170,Lp=34,R=12,T=12,B=24,v=ks.map(k=>G.bw[k]);
  let lo=Math.floor((Math.min(...v)-.5)*2)/2,hi=Math.ceil((Math.max(...v)+.5)*2)/2;if(hi-lo<2){lo-=.5;hi+=.5}
  const span=Math.max(1,diffDays(ks[0],ks[ks.length-1]));
  const X=k=>Lp+diffDays(ks[0],k)/span*(W-Lp-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
  const grid=[lo,(lo+hi)/2,hi].map(y=>`<line x1="${Lp}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}" stroke="#34343B" stroke-width="1"/><text x="${Lp-6}" y="${Y(y)+3.5}" fill="#A2A1AB" font-size="10" font-weight="700" font-family="inherit" text-anchor="end">${fmt1(y)}</text>`).join('');
  const d=ks.map((k,i)=>(i?'L':'M')+X(k).toFixed(1)+' '+Y(G.bw[k]).toFixed(1)).join('');
  const dots=ks.map((k,i)=>`<circle cx="${X(k)}" cy="${Y(G.bw[k])}" r="${i===ks.length-1?5:3}" fill="${i===ks.length-1?'#F5F4F7':GB}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kroppsvikt över tid">${grid}<path d="${d}" fill="none" stroke="${GB}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw"/>${dots}
  <text x="${Lp}" y="${H-6}" fill="#A2A1AB" font-size="10.5" font-weight="700" font-family="inherit">${dlabel(ks[0])}</text><text x="${W-R}" y="${H-6}" fill="#A2A1AB" font-size="10.5" font-weight="700" font-family="inherit" text-anchor="end">${dlabel(ks[ks.length-1])}</text></svg>`;
}
function bwHTML(){
  const ks=Object.keys(G.bw).sort(),t=today(),last=ks[ks.length-1],cur=last?G.bw[last]:null;
  let meta=last?'Vägd '+(last===t?'idag':dlabel(last)):'Ingen vägning än';
  if(ks.length>1){const df=cur-G.bw[ks[0]];meta+=`, ${df>0?'+':df<0?'−':'±'}${fmt1(Math.abs(df))} kg sedan ${dlabel(ks[0])}`}
  const hist=[...ks].reverse().slice(0,14);
  return `<section class="bwc"><div class="bwn">${cur!=null?fmt1(cur):'–'}<em>kg</em></div><div class="mu">${meta}</div>
    <div class="bwrow"><label class="gin"><span>Idag</span><input id="bwi" inputmode="decimal" value="${G.bw[t]!=null?fmt1(G.bw[t]):''}" placeholder="${cur!=null?fmt1(cur):'0,0'}" autocomplete="off" enterkeyhint="done"><em>kg</em></label><button class="bwsave" data-g="bwsave">${G.bw[t]!=null?'Uppdatera':'Spara'}</button></div></section>
  <section class="bwch"><h3>Över tid</h3>${bwChart(ks)}</section>
  ${hist.length?`<section class="bwh"><h3>Vägningar</h3>${hist.map(k=>`<div class="bwi"><span>${k===t?'Idag':dlabel(k)}</span><b>${fmt1(G.bw[k])} kg</b><button data-g="bwdel" data-k="${k}" aria-label="Ta bort vägningen ${dlabel(k,true)}">×</button></div>`).join('')}</section>`:''}`;
}
function saveBW(o){
  const v=num(o.querySelector('#bwi').value);
  if(!(v>=30&&v<=250)){gToast('Skriv vikten i kg, t.ex. 83,2');return}
  const t=today(),had=G.bw[t]!=null;G.bw[t]=Math.round(v*10)/10;gsave();gvRender();renderGym();gToast(had?'Dagens vikt uppdaterad':'Vikt sparad');
}
function bindGv(o){
  o.addEventListener('click',e=>{
    const b=e.target.closest('[data-g]');if(!b)return;
    const a=b.dataset.g,card=b.closest('.ex'),id=card&&card.dataset.id,ex=id&&G.ex.find(x=>x.id===id);
    if(a==='close'){closeCat();return}
    if(a==='toggle'){ui.openEx[id]=!ui.openEx[id];gvRender();return}
    if(a==='raise'&&ex){ex.w=Math.round((ex.w+ex.step)*100)/100;gsave();gvRender();gToast(`Vikten höjd till ${fmtKg(ex.w)} kg`);return}
    if(a==='addex'){ui.gform={k:'ex',id:null};gvRender();const i=o.querySelector('[data-f=name]');if(i){i.focus();i.scrollIntoView({block:'center',behavior:RM()?'auto':'smooth'})}return}
    if(a==='editex'){ui.gform={k:'ex',id};gvRender();return}
    if(a==='fcancel'){ui.gform=null;gvRender();return}
    if(a==='fsave'){const f=b.closest('.gform'),q=k=>f.querySelector(`[data-f=${k}]`).value;
      const name=q('name').trim();if(!name){gToast('Ge övningen ett namn');return}
      const sets=Math.min(10,Math.max(1,Math.round(num(q('sets')))||3)),thr=Math.min(100,Math.max(1,Math.round(num(q('thr')))||8)),step=num(q('step'))>0?num(q('step')):2.5,w=Math.max(0,num(q('w')));
      if(ui.gform.id){const x=G.ex.find(y=>y.id===ui.gform.id);if(x){const wc=x.w!==w;Object.assign(x,{name,sets,thr,step,w});const c=(L[today()]||{})[x.id];if(wc&&c){c.w=w;gsave(today())}}}
      else{const nid=newId();G.ex.push({id:nid,cat:ui.gv.cat,name,w,sets,thr,step});ui.openEx[nid]=true}
      ui.gform=null;gsave();gvRender();return}
    if(a==='fdel'){const i=G.ex.findIndex(y=>y.id===ui.gform.id);if(i<0)return;const it=G.ex[i];G.ex.splice(i,1);ui.gform=null;gsave();gvRender();
      showUndo('Övning borttagen',()=>{G.ex.splice(Math.min(i,G.ex.length),0,it);gsave();gvRender()});return}
    if(a==='step'){const k=b.dataset.k;if(G.ladder[k])delete G.ladder[k];else{G.ladder[k]=today();if(navigator.vibrate)navigator.vibrate(8)}gsave();gvRender();
      if(G.ladder[k]){const nb=o.querySelector(`[data-k="${k}"] .ck`);sparks(nb,['#2FD27B','#3E7BFF','#F5F4F7'],k==='oap'?30:14)}return}
    if(a==='addpb'){ui.gform={k:'pb',id:null};gvRender();const i=o.querySelector('[data-f=kg]');if(i)i.focus();return}
    if(a==='editpb'){ui.gform={k:'pb',id:b.dataset.id};gvRender();return}
    if(a==='pbsave'){const f=b.closest('.gform'),n=f.querySelector('[data-f=n]').value.trim()||'Marklyft',kg=num(f.querySelector('[data-f=kg]').value);
      if(!(kg>0)){gToast('Skriv vikten i kg');return}
      const prev=G.pb.filter(p=>p.n.toLowerCase()===n.toLowerCase()&&p.id!==(ui.gform.id||'')).reduce((m,p)=>Math.max(m,p.kg),0);
      if(ui.gform.id){const p=G.pb.find(x=>x.id===ui.gform.id);if(p)Object.assign(p,{n,kg})}else G.pb.push({id:newId(),n,kg,d:today()});
      const isNew=!ui.gform.id;ui.gform=null;gsave();gvRender();
      if(isNew&&kg>prev){gToast(prev?`Nytt rekord, +${fmtKg(kg-prev)} kg`:'PB sparat');sparks(o.querySelector('.pbr'),['#FFB81C','#FFD978','#F5F4F7'],20)}else gToast('PB sparat');return}
    if(a==='pbdel'){const i=G.pb.findIndex(p=>p.id===ui.gform.id);if(i<0)return;const it=G.pb[i];G.pb.splice(i,1);ui.gform=null;gsave();gvRender();
      showUndo('PB borttaget',()=>{G.pb.splice(Math.min(i,G.pb.length),0,it);gsave();gvRender()});return}
    if(a==='bwsave'){saveBW(o);return}
    if(a==='bwdel'){const k=b.dataset.k,v=G.bw[k];delete G.bw[k];gsave();gvRender();renderGym();
      showUndo('Vägning borttagen',()=>{G.bw[k]=v;gsave();gvRender();renderGym()});return}
  });
  o.addEventListener('input',e=>{
    const el=e.target,card=el.closest('.ex');if(!card)return;const ex=G.ex.find(x=>x.id===card.dataset.id);if(!ex)return;const t=today();
    if(el.dataset.gw!==undefined){ex.w=Math.max(0,num(el.value));const c=(L[t]||{})[ex.id];if(c){c.w=ex.w;gsave(t)}else gsave()}
    else if(el.dataset.gr!==undefined){
      const i=+el.dataset.gr,v=el.value.replace(/\D/g,'').slice(0,3);if(v!==el.value)el.value=v;
      L[t]=L[t]||{};let c=L[t][ex.id];if(!c)c=L[t][ex.id]={w:ex.w,r:[]};
      c.r[i]=v===''?null:+v;while(c.r.length&&c.r[c.r.length-1]==null)c.r.pop();
      if(!c.r.length)delete L[t][ex.id];gsave(t);
    }
    card.querySelector('.recw').innerHTML=recHTML(ex);
  });
  o.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;const el=e.target;
    if(el.id==='bwi'){e.preventDefault();saveBW(o);return}
    const f=el.closest('.gform');if(f){e.preventDefault();const all=[...f.querySelectorAll('input')],i=all.indexOf(el);if(i<all.length-1)all[i+1].focus();else f.querySelector('.btn.fill').click();return}
    const card=el.closest('.ex');if(card){e.preventDefault();const all=[...card.querySelectorAll('input')],i=all.indexOf(el);if(i<all.length-1)all[i+1].focus();else el.blur()}
  });
}

/* ---------- sidbyte ---------- */
const pg={pos:0,vel:0,raf:0};
const pagesW=()=>document.getElementById('pages').clientWidth;
function setTrack(x){
  pg.pos=x;document.getElementById('track').style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
  const p=Math.min(1,Math.max(0,-x/pagesW())),bs=document.querySelectorAll('.pager i');
  bs[0].style.opacity=(1-.7*p).toFixed(3);bs[1].style.opacity=(.3+.7*p).toFixed(3);
}
function goPage(i){
  if(ui.page===i&&!pg.raf)return;
  ui.page=i;updGymHead();if(i===0){const gb=document.querySelector('.gymb');if(gb){const tmp=document.createElement('div');tmp.innerHTML=gymBtn();gb.replaceWith(tmp.firstElementChild)}}const to=-i*pagesW(),panes=[document.getElementById('app'),document.getElementById('gym')];
  document.querySelectorAll('.pager button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'page':'false'));
  panes.forEach(p=>p.classList.remove('off'));
  if(scrollY>0)scrollTo(0,0);
  cancelAnimationFrame(pg.raf);pg.raf=0;
  if(RM()){setTrack(to);pg.vel=0;panes[1-i].classList.add('off');panes[i].animate([{opacity:0},{opacity:1}],{duration:200});return}
  const w=2*Math.PI/.42,C1=pg.pos-to,C2=pg.vel+w*C1,t0=performance.now();
  const f=now=>{const t=(now-t0)/1000,ex=Math.exp(-w*t),x=to+(C1+C2*t)*ex,v=(C2-w*(C1+C2*t))*ex;pg.vel=v;
    if(Math.abs(x-to)<.4&&Math.abs(v)<8){setTrack(to);pg.vel=0;pg.raf=0;panes[1-i].classList.add('off');return}
    setTrack(x);pg.raf=requestAnimationFrame(f)};
  pg.raf=requestAnimationFrame(f);
}
document.addEventListener('click',e=>{const b=e.target.closest('.pager [data-page]');if(b)goPage(+b.dataset.page)});
window.addEventListener('resize',()=>{if(!pg.raf)setTrack(-(ui.page||0)*pagesW())});

/* ---------- start ---------- */
(async()=>{
  S=Object.assign(fresh(),JSON.parse(JSON.stringify(BAKED)));G=gFresh();
  S.rem=clone(REM.lists[0].items);
  let done=false;const st=initStorage().then(()=>{done=true});
  await Promise.race([st,new Promise(r=>setTimeout(r,2500))]);
  day(today());ui.boot=true;ui.draw=true;render();renderGym();setTrack(0);ui.boot=false;
  if(!done){await st;day(today());render();renderGym()}
  save();gsave();
  if(!answered(today()))setTimeout(openQ,RM()?0:650);else afterQ();
  let last=today();
  setInterval(()=>{if(today()!==last){last=today();day(last);render();if(!answered(last))openQ()}},60000);
})();
</script>
