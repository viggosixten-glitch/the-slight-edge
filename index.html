<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB;
  --green:#2FD27B;--red:#FF5B4A;--teal:#22D3C5;--violet:#9B6BFF;--amber:#FFB81C;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --ser:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB}}
:root[data-theme="dark"]{--bg:#2A2A2F;--s1:#1F1F23;--s2:#303036;--tx:#F5F4F7;--mu:#A2A1AB}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none;font-optical-sizing:auto}
button,[role="button"],.chip,.mini,.tl{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.swipe>.habit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lbl,.st,.sm,.mu,.legend span,.chip,.lbl2,.qmeta,.qlater,.hero-q span,.edge,.frow,.due,.warn{letter-spacing:.01em}
.h2,.cost .ttl{letter-spacing:-.025em}
.qstage{overscroll-behavior:contain}
html,body{background:var(--bg);color:var(--tx);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{padding:12px 12px 56px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:0;border-radius:14px;padding:12px 14px;width:100%;outline:none}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:#75747E}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* Hero */
.hero{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/5;max-height:560px;width:100%;background:var(--s1)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(31,31,35,.6) 0%,rgba(31,31,35,0) 26%,rgba(31,31,35,.15) 48%,rgba(31,31,35,.97) 100%)}
.hero-top{position:absolute;z-index:2;top:16px;left:18px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top .d{font-weight:700;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.hero-q{position:absolute;z-index:2;left:22px;right:22px;bottom:24px}
.hero-q p{font-family:var(--ser);font-style:italic;font-size:clamp(27px,7.4vw,36px);line-height:1.12;letter-spacing:-.01em}
.hero-q span{display:block;margin-top:12px;color:var(--mu);font-size:14px;font-weight:700}

/* Cards */
.card{background:var(--s1);border-radius:26px;padding:20px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu)}

.north{background:var(--violet);color:var(--bg);text-align:left;width:100%}
.north .big{font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.north .sub{margin-top:14px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:999px;background:rgba(16,13,24,.22);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--bg)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;border-radius:24px;padding:18px 16px;background:var(--s1);display:flex;flex-direction:column;gap:4px;min-height:132px}
.mcard .lbl{font-size:13px;font-weight:700}
.mcard .amt{font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:-.03em;margin-top:auto}
.mcard .sm{font-size:12px;color:var(--mu);font-weight:600}

/* Habits */
.today-h{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;opacity:.25}
.dots i.on{opacity:1}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--s1);border-radius:24px;padding:16px;transition:background-color .18s ease,color .18s ease,transform .1s ease}
.habit:active{transform:scale(.985)}
.habit .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.habit .dot svg{opacity:0;transition:opacity .15s}
.habit .mid{min-width:0;flex:1}
.habit .area{font-size:13px;font-weight:800}
.habit .txt{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px}
.habit .warn{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit .stk{text-align:right;flex:none}
.habit .stk b{display:block;font-size:24px;font-weight:800;line-height:1}
.habit .stk small{font-size:11px;font-weight:700;opacity:.7}
.habit.done{color:var(--bg)}
.habit.done .dot svg{opacity:1}
.habit.done .area{color:var(--bg)!important;opacity:.7}
.habit .due{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit.done .due{display:none}
.lhead{display:flex;align-items:center;gap:8px;padding:8px 6px 0;font-weight:800;font-size:15px}
.lhead i{width:10px;height:10px;border-radius:50%}
.lhead small{color:var(--mu);font-weight:700;font-size:13px;margin-left:auto}
.fixed{width:100%;text-align:left}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600;padding:5px 0}
.frow span:last-child{font-weight:800}
.left{margin-top:12px;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.left b{font-size:22px;letter-spacing:-.02em}
.fx{display:flex;gap:8px;margin-top:8px}
.fx input:first-child{flex:1.6}.fx input:nth-child(2){flex:1}
.fx button{flex:none;width:46px;border-radius:14px;background:var(--s2);font-weight:800;font-size:20px;color:var(--red)}
.cost{display:flex;gap:8px;background:var(--s1);border-radius:26px;padding:8px;touch-action:pan-y;user-select:none}
.cost .full{flex:1;min-width:0;padding:12px 8px 14px 12px}
.cost .full.in-l{animation:inl .22s ease-out}.cost .full.in-r{animation:inr .22s ease-out}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}}@keyframes inr{from{opacity:0;transform:translateX(18px)}}
.cost .mini{flex:none;width:44px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--bg);letter-spacing:.02em}
.cost .mini span{writing-mode:vertical-rl}
.cost .mini.l span{transform:rotate(180deg)}
.cost .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cost .ttl{font-size:19px;font-weight:800;letter-spacing:-.02em}
.cost .st{font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.cost .sum{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:10px 0 6px}
.more{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--tx)}
.tl{width:100%;text-align:left;background:var(--s2);border-radius:18px;padding:14px;margin-top:8px}
.tl .row b{font-size:15px;font-weight:800}
.tl .cnt{display:flex;gap:6px}
.tl .cnt span{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;color:var(--bg)}
.tl .grp{margin-top:12px}
.tl .grp h4{font-size:13px;font-weight:800;margin-bottom:4px}
.tl .grp p{font-size:15px;line-height:1.45;font-weight:500}
.edge{padding:6px 6px 2px;font-size:17px;font-weight:700;line-height:1.3;color:var(--mu)}
.edge b{font-size:30px;font-weight:800;color:var(--tx);letter-spacing:-.03em;margin:0 2px}
.goal{margin-top:14px}
.goal .gl{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.swipe{position:relative;border-radius:24px;overflow:hidden}
.swipe.sw{background:var(--red)}
.swipe:not(.sw)>.lbl{display:none}
.swipe>.lbl{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--bg);font-weight:800;font-size:14px}
.swipe>.habit{position:relative;touch-action:pan-y}
.swipe>.habit.snap{transition:transform .32s var(--ease-out),background-color .18s ease}
.swipe>.habit.out{transition:transform .2s var(--ease-out),opacity .2s var(--ease-out);transform:translateX(-110%)!important;opacity:0}
.hbtn{display:flex;gap:8px;align-items:center}
.rbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--tx);font-size:22px;font-weight:800}
.undo-w{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.undo{pointer-events:auto;display:flex;align-items:center;gap:14px;background:rgba(40,40,46,.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);color:var(--tx);box-shadow:0 10px 30px rgba(0,0,0,.35);border-radius:999px;padding:8px 8px 8px 18px;font-weight:800;font-size:15px;max-width:496px;width:100%;justify-content:space-between;animation:up .2s ease-out}
.undo button{background:var(--tx);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.card,.mcard,.cost,.inl,.swipe>.habit:not(.done),.hero{background-image:linear-gradient(155deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 46%)}
.card,.mcard,.cost,.inl,.swipe,.hero{box-shadow:0 0 22px rgba(255,255,255,.05),0 12px 28px rgba(0,0,0,.30)}
.sync{font-size:13px;color:var(--mu);font-weight:600;padding:2px 6px}

/* Curve */
.seg{display:flex;background:var(--s2);border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;color:var(--mu)}
.seg button.on{background:var(--tx);color:var(--bg)}
.chart{margin-top:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.legend i{width:9px;height:9px;border-radius:50%}
.stat{margin-top:14px;font-size:15px;font-weight:600;line-height:1.4}
.stat b{font-weight:800}

/* 10-10-10 */
.tabs{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.tabs button{flex:1;border-radius:16px;padding:11px 8px;font-size:14px;font-weight:800;background:var(--s2);white-space:nowrap}
.tabs button small{display:block;font-size:11px;font-weight:700;opacity:.7;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.li{display:flex;align-items:center;gap:10px}
.li b{width:22px;flex:none;text-align:right;font-weight:800;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border-radius:16px;padding:14px 12px;font-weight:800;font-size:15px;background:var(--s2)}
.btn.fill{color:var(--bg)}

.refl textarea{margin-top:8px}
.refl label{display:block;margin-top:14px;font-weight:700;font-size:15px}

.foot{display:flex;justify-content:center;margin-top:6px}
.foot button{color:var(--mu);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--s1)}

/* Sheet */
.inl{background-color:var(--s1);border-radius:26px;padding:22px 18px}
.inl input,.inl textarea,.inl .btn,.inl .fx button{background:var(--bg)}
.inl .btn.fill{background:inherit}
.inl h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.inl p{color:var(--mu);margin-top:6px;font-size:15px;line-height:1.4}
.inl .fld{margin-top:16px}
.inl .fld span{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.inl .acts{margin-top:20px}
.toast{align-self:center;background:var(--tx);color:var(--bg);font-weight:800;padding:10px 16px;border-radius:999px;font-size:14px}
.warnbar{background:var(--red);color:var(--bg);border-radius:18px;padding:12px 16px;font-weight:800;font-size:14px}
/* Morgonfrågor */
.qo{position:fixed;inset:0;z-index:80}
.qbg{position:absolute;inset:0;background:rgba(10,10,14,.18);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fade .35s ease both}
.qo.fade .qbg{animation:fadeout .5s ease both}
@keyframes fadeout{to{opacity:0}}
.qbox{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:520px;margin:0 auto;border-radius:32px;
  background:rgba(8,8,12,.2);-webkit-backdrop-filter:blur(20px) saturate(0%) brightness(.8);backdrop-filter:blur(20px) saturate(0%) brightness(.8);display:flex;flex-direction:column;padding:22px 20px 20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45);animation:qin .36s var(--ease-out) both}
@keyframes qin{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(4px)}}
.qbox.bye{animation:qout .22s var(--ease-out) both}
.qbox.away{animation:qaway .22s var(--ease-out) both}
@keyframes qout{to{opacity:0;transform:scale(.96);filter:blur(4px)}}
@keyframes qaway{to{opacity:0;transform:translateY(20px) scale(.97)}}
.qbox::before,.qbox::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:3px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.qbox::before{background:linear-gradient(115deg,#FF3B3B,#FF9F1C,#FFE14D,#3DDC84,#27C7FF,#3E6BFF,#A45BFF,#FF4FB3,#FF3B3B);background-size:180% 180%;animation:wave1 7s ease-in-out infinite}
.qbox::after{background:linear-gradient(245deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));background-size:260% 260%;animation:wave2 4.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes wave1{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes wave2{0%{background-position:100% 0%}50%{background-position:0% 100%}100%{background-position:100% 0%}}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qprog{display:flex;gap:6px;flex:1}
.qprog i{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.14);transition:background-color .3s ease}
.qprog i.on{background:#4F8DFF}
.qlater{color:var(--mu);font-weight:700;font-size:14px;padding:6px 4px}
.qmeta{margin-top:18px;font-size:13px;font-weight:800;color:#7FB0FF;letter-spacing:.02em}
.qstage{flex:1;overflow:auto;margin-top:8px;padding:2px}
.qstage h2{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.qstage p{color:rgba(255,255,255,.74);font-size:15px;line-height:1.4;margin-top:10px;font-weight:600;letter-spacing:.01em}
.qf{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.qi{display:flex;align-items:center;gap:12px}
.qi b{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:#2F6BFF;color:#fff;font-size:14px;font-weight:800}
.qstage input,.qstage textarea{background:rgba(255,255,255,.08);font-size:18px;font-weight:600;padding:15px 16px;border-radius:18px}
.qstage textarea{min-height:120px;resize:none;line-height:1.4}
.qin{animation:qstep .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes qstep{from{opacity:0;transform:translateX(var(--qx,30px))}}
.qnav{display:flex;gap:10px;margin-top:14px}
.qnav button{flex:1;border-radius:18px;padding:17px 12px;font-weight:800;font-size:16px}
.qback{background:rgba(255,255,255,.08)}
.qnext{background:#2F6BFF;color:#fff;flex:2!important}
.qnext[disabled]{opacity:.35}
.qcheck{position:fixed;inset:0;z-index:81;display:grid;place-items:center;pointer-events:none}
.qcheck svg{width:128px;height:128px;animation:popin .5s cubic-bezier(.2,.8,.2,1) both}
.qcheck path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out .25s forwards}
.qcheck.fade svg{animation:qout .25s var(--ease-out) both}
.nudge{background:linear-gradient(135deg,#1A4DFF,#2F6BFF 55%,#4FA8FF)!important;color:#fff}
.nudge .nh{font-size:22px;font-weight:800;letter-spacing:-.02em}
.nudge p{margin-top:8px;font-size:16px;line-height:1.4;font-weight:600;opacity:.95}
.edgecard{display:flex;align-items:center;justify-content:space-between;gap:12px}
.edgecard .eff{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.edgecard .lbl2{font-size:13px;font-weight:700;color:var(--mu);margin-bottom:6px}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.chip{border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;background:var(--s2);color:var(--tx);white-space:nowrap}
.chip.ok{background:var(--green);color:var(--bg)}
.chip.go{background:#2F6BFF;color:#fff}
.tl .ans{margin-top:12px}
.tl .ans h4{font-size:13px;font-weight:800;color:#7FB0FF;margin-bottom:4px}
.tl .ans p{font-size:15px;line-height:1.45;font-weight:500}
.tl .ans{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-transparency:reduce){.qbox{background:rgba(24,24,28,.97)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.qbg{background:rgba(10,10,14,.6)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}.undo{background:#2E2E34!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
/* Mikroanimationer */
.rise{animation:rise .42s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hero.boot img{animation:settle 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{transform:scale(1.07);filter:brightness(.7)}}
.hero.boot .hero-q{animation:rise .7s cubic-bezier(.2,.8,.2,1) .35s both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.45,0,.2,1) .12s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .6s ease .5s both}
@keyframes fade{from{opacity:0}}
.popin{transform-box:fill-box;transform-origin:center;animation:popin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes popin{from{opacity:0;transform:scale(.85)}}
.justdone .dot{animation:dotpop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes dotpop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.justdone .dot svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .34s ease-out .08s forwards}
.dots i{transition:opacity .3s ease}
.dots i.pop{animation:dotpop .42s cubic-bezier(.2,.8,.2,1)}
.inl{animation:sheet .3s cubic-bezier(.2,.8,.2,1) both;transform-origin:top center}
.inl.closing{animation:sheetout .16s var(--ease-out) both}
@keyframes sheet{from{opacity:0;transform:translateY(-10px) scale(.98)}}
@keyframes sheetout{to{opacity:0;transform:translateY(-6px) scale(.98)}}
.toast{animation:popin .35s cubic-bezier(.2,.8,.2,1) both}
.undo-w.out .undo{animation:down .18s var(--ease-out) both}
@keyframes down{to{opacity:0;transform:translateY(14px)}}
.tl .grp{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
button{transition:transform 160ms var(--ease-out),background-color 180ms ease,color 180ms ease,opacity 180ms ease}
.rbtn:active,.btn:active,.mini:active,.mcard:active,.tabs button:active,.seg button:active,.more:active,.foot button:active,.undo button:active,.tl:active,.chip:active,.qnav button:active,.qlater:active{transform:scale(.97)}
.habit:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rise,.inl,.qbox,.qbg,.toast,.undo,.qcheck svg,.popin{animation:fade .2s ease both!important}.draw,.justdone .dot svg path,.qcheck path{stroke-dasharray:none;stroke-dashoffset:0}}
</style>

async function flush(){
  if(!loaded)return;
  if(storageOK==='db'){
    const m=JSON.stringify(mainData());
    if(m!==lastMain){try{await mainRef.set(JSON.parse(m));lastMain=m}catch(e){}}

      const d=S.days[k];if(!d||!d.a)continue;
      const o={a:clone(d.a),q:!!d.q},j=JSON.stringify(o);if(j===lastDay[k])continue;

function curve(){const n=diffDays(S.start,today())+1;const v=[1];for(let j=0;j<n;j++)v.push(v[v.length-1]*dayFactor(addDays(S.start,j)));return v}
let QI=null;
function quote(){

function countUps(root){
  if(RM())return;
  root.querySelectorAll('.amt,.cost .sum,.edge b').forEach(el=>{
    const txt=el.textContent,m=txt.replace(/\s/g,'').match(/^(\d+)(kr)?$/);if(!m)return;
    const to=+m[1],isKr=!!m[2];if(!to)return;const t0=performance.now()+250,dur=900;
    const f=now=>{const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3),v=Math.round(to*e);
      el.textContent=isKr?kr(v):String(v);if(p<1)requestAnimationFrame(f)};

function flipRender(){

function setChart(s){ui.draw=true;const el=document.getElementById('chartcard');if(ui.chart===s||(el&&el.dataset.busy))return;ui.chart=s;swapCard(el,chartCard,s==='goal')}
function swapCard(old,build,toRight,fs='.full',ms='.mini'){
  if(!old)return;
  if(RM()){old.outerHTML=build();return}
  old.dataset.busy='1';
  const h0=old.offsetHeight,ease='cubic-bezier(.23,1,.32,1)',dx=toRight?-38:38;
  old.style.height=h0+'px';old.style.overflow='hidden';
  const f=old.querySelector(fs),m=ms?old.querySelector(ms):null;
  f.style.transition=`transform .16s ${ease},opacity .16s ${ease},filter .16s ${ease}`;f.style.transform=`translateX(${dx}%)`;f.style.opacity='0';f.style.filter='blur(3px)';
  if(m){m.style.transition=`opacity .12s ${ease},transform .16s ${ease}`;m.style.opacity='0';m.style.transform=`translateX(${toRight?40:-40}px)`}
  setTimeout(()=>{
    const tmp=document.createElement('div');tmp.innerHTML=build();const nw=tmp.firstElementChild;
    const nf=nw.querySelector(fs),nm=ms?nw.querySelector(ms):null;
    nf.style.transform=`translateX(${-dx}%)`;nf.style.opacity='0';nf.style.filter='blur(3px)';
    if(nm){nm.style.transform=`translateX(${toRight?-40:40}px)`;nm.style.opacity='0'}
    nw.style.overflow='hidden';old.replaceWith(nw);
    const h1=nw.offsetHeight;nw.style.height=h0+'px';void nw.offsetHeight;
    requestAnimationFrame(()=>{
      nw.style.transition=`height .3s ${ease}`;nw.style.height=h1+'px';
      nf.style.transition=`transform .3s ${ease},opacity .24s ${ease},filter .24s ${ease}`;nf.style.transform='none';nf.style.opacity='1';nf.style.filter='none';
      if(nm){nm.style.transition=`transform .3s ${ease},opacity .22s linear`;nm.style.transform='none';nm.style.opacity='1'}
      setTimeout(()=>{nw.style.height='';nw.style.overflow='';nw.style.transition='';[nf,nm].filter(Boolean).forEach(x=>{x.style.transition='';x.style.transform='';x.style.opacity='';x.style.filter=''})},320);
    });
  },160);
}
function goalText(){
  const m=revOf(today().slice(0,7)),next=GOALS.find(x=>x>m),hit=GOALS.filter(x=>x<=m).length;
  let s=next?`Nästa mål: <b>${kr(next)}/mån</b>${next===GOAL?' (lön från AB)':''}. Kvar: <b>${kr(next-m)}</b>. `:'<b>Alla mål nådda den här månaden.</b> ';
  s+=`Nådda: <b>${hit} av ${GOALS.length}</b>.`;
  const sal=salOf(today().slice(0,7));
  if(sal)s+=` Omsättningen är ${m>=sal?'<b>'+dec(m/sal,1)+' gånger</b>':'<b>'+Math.round(m/sal*100)+' %</b> av'} din lön.`;
  return s;
}
function goalChart(){
  const ms=months();while(ms.length<4)ms.push(addDays(ms[ms.length-1]+'-01',32).slice(0,7));
  const cur=today().slice(0,7),curRev=revOf(cur);
  const W=300,H=240,L=30,R=8,T=16,B=12,split=L+(W-L-R)*.62;
  const lo=500,hi=260000,lg=Math.log10;
  const Y=v=>T+(1-(lg(Math.max(lo,v))-lg(lo))/(lg(hi)-lg(lo)))*(H-T-B);
  const X=i=>L+(i/ms.length)*(split-L-6);
  const step=f=>{let d='',prev=null;ms.forEach((m,i)=>{if(m>cur)return;const v=f(m);if(!v){prev=null;return}
    const y=Y(v).toFixed(1);d+=(prev===null?'M':'L')+X(i).toFixed(1)+' '+y+'L'+X(i+1).toFixed(1)+' '+y;prev=v});return d};
  const path=(f,c)=>{const d=step(f);return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''};
  const flat=(v,c,t,below)=>v?`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="3" stroke-linecap="round"${ui.drawNow?' pathLength="1" class="draw"':''}/>`:'';
  const next=GOALS.find(x=>x>curRev);
  const grid=[1000,10000,100000].map(v=>`<line x1="${L}" x2="${split}" y1="${Y(v)}" y2="${Y(v)}" stroke="#34343B" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3.5}" fill="#A2A1AB" font-size="9.5" font-weight="700" font-family="inherit" text-anchor="end">${krK(v)}</text>`).join('');
  const zx=i=>split+14+i*((W-R-split-26)/(GOALS.length-1));
  const dots=GOALS.map((v,i)=>{const ok=curRev>=v,x=zx(i),y=Y(v);
    return `<circle cx="${x}" cy="${y}" r="${v===GOAL?7:5.5}" fill="${ok?'#2FD27B':'#F5F4F7'}"${ui.drawNow?` class="popin" style="animation-delay:${.35+i*.07}s"`:''}/>
    <text x="${x-9}" y="${y+3.5}" fill="${ok?'#2FD27B':'#F5F4F7'}" font-size="10" font-weight="800" font-family="inherit" text-anchor="end">${v===GOAL?'Lön från AB':krK(v)}</text>`}).join('');
  const nl=next?`<line x1="${L}" x2="${zx(GOALS.indexOf(next))}" y1="${Y(next)}" y2="${Y(next)}" stroke="#F5F4F7" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>`:'';
  const mlab=ms.map((m,i)=>(i===0||m===cur||i===ms.length-1)?`<text x="${(X(i)+X(i+1))/2}" y="${H-6}" fill="${m===cur?'#F5F4F7':'#A2A1AB'}" font-size="10" font-weight="700" font-family="inherit" text-anchor="middle">${MON[+m.slice(5)-1].slice(0,3)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Omsättning och lön per månad mot målen">
    ${curRev?`<rect x="${L}" y="${Y(curRev)}" width="${W-R-L}" height="${Math.max(0,H-B-Y(curRev))}" fill="#9B6BFF" opacity=".16"${ui.drawNow?' class="fadein"':''}/>`:''}${grid}${nl}${flat(salOf(cur),'#22D3C5','Din lön',salOf(cur)<curRev&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${flat(curRev,'#9B6BFF','Omsättning',curRev<=salOf(cur)&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${dots}</svg>`;
}
function chart(){
  const v=curve(),n=v.length-1;
  const xmax=ui.range==='30'?Math.max(30,n):Math.max(365,n);
  const W=340,H=200,L=6,R=46,T=12,B=24;
  const rate=Math.pow(v[n],1/n);
  const proj=[];if(ui.range==='365'){for(let x=n;x<=xmax;x++)proj.push([x,v[n]*Math.pow(rate,x-n)])}
  const vis=v.slice(0,xmax+1);
  const ys=[2,Math.pow(1.01,xmax),Math.pow(.99,xmax),...vis,...proj.map(p=>p[1])];
  const ymax=Math.max(...ys)*1.04,ymin=Math.min(...ys,1)*(ui.range==='30'?.98:1);
  const X=x=>L+(x/xmax)*(W-L-R), Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  const path=f=>{let d='';const st=Math.max(1,Math.floor(xmax/120));for(let x=0;x<=xmax;x+=st)d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f(x)).toFixed(1);d+='L'+X(xmax).toFixed(1)+' '+Y(f(xmax)).toFixed(1);return d};
  const you=vis.map((y,x)=>(x?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const pj=proj.length?proj.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(''):'';
  const sE=Math.pow(1.01,xmax),fE=Math.pow(.99,xmax);
  const lbl=y=>'×'+(y>=10?dec(y,0):dec(y,2));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva över din utveckling jämfört med success- och failure-kurvan">
    <line x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}" stroke="#45454D" stroke-width="1.5" stroke-dasharray="3 5"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(2)}" y2="${Y(2)}" stroke="${v[n]>=2?'#2FD27B':'#F5F4F7'}" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>
    <text x="${X(Math.min(70,xmax))<(W-R)/2?X(Math.min(70,xmax))+10:L}" y="${Y(2)-(X(Math.min(70,xmax))<(W-R)/2?12:8)}" fill="${v[n]>=2?'#2FD27B':'#F5F4F7'}" font-size="11" font-weight="800" font-family="inherit">100 % bättre${v[n]>=2?', nått':''}</text>
    <path d="${path(x=>Math.pow(1.01,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#2FD27B" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <path d="${path(x=>Math.pow(.99,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#FF5B4A" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    ${pj?`<path d="${pj}" fill="none" stroke="#F5F4F7" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" opacity=".6"/>`:''}
    <path d="${you}"${ui.drawNow?' pathLength="1" class="draw" style="animation-delay:.3s"':''} fill="none" stroke="#F5F4F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(Math.min(70,xmax))}" cy="${Y(2)}" r="6.5" fill="${v[n]>=2?'#2FD27B':'#F5F4F7'}"${ui.drawNow?' class="popin" style="animation-delay:.9s"':''}/>
    <circle cx="${X(n)}" cy="${Y(v[n])}" r="5.5" fill="#F5F4F7"${ui.drawNow?' class="popin" style="animation-delay:1.1s"':''}/>
    <text x="${W-R+6}" y="${Y(sE)+4}" fill="#2FD27B" font-size="12" font-weight="800" font-family="inherit">${lbl(sE)}</text>
    <text x="${W-R+6}" y="${Math.min(H-B,Y(fE)+4)}" fill="#FF5B4A" font-size="12" font-weight="800" font-family="inherit">${lbl(fE)}</text>
    <text x="${L}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit">Dag 1</text>
    <text x="${W-R}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit" text-anchor="end">Dag ${xmax}</text>
  </svg>`;
}

    if(RM()){ui.popDot=true;render();return}
    b.classList.add('done','justdone');b.style.background='var(--green)';
    const dt=b.querySelector('.dot');dt.style.background='var(--bg)';dt.style.color='var(--green)';
    setTimeout(()=>{ui.popDot=true;flipRender()},380);
  }
  else if(a==='editcost'){anchorEl=document.getElementById('cost');costSheet()}
  else if(a==='side'){setSide(b.dataset.s)}
  else if(a==='tl'){const k=b.dataset.k;ui.tl[k]=!ui.tl[k];document.getElementById('tlw').innerHTML=tlHTML()}
  else if(a==='openq')openQ();
  else if(a==='tl0'){const k=today();ui.tl[k]=true;document.getElementById('tlw').innerHTML=tlHTML();document.getElementById('tlw').scrollIntoView({behavior:RM()?'auto':'smooth',block:'center'})}
  else if(a==='range'){ui.range=b.dataset.r;ui.draw=true;document.getElementById('chartcard').outerHTML=chartCard()}
  else if(a==='cside'){setChart(b.dataset.s)}
  else if(a==='salary')salarySheet(null,false);
  else if(a==='revenue')revenueSheet();
  else if(a==='settings')settingsSheet();
});
function setSide(s){const el=document.getElementById('cost');if(ui.cost===s||(el&&el.dataset.busy))return;ui.cost=s;swapCard(el,costCard,s==='biz')}
let sx=null,sy=null;
let rs=null;
document.addEventListener('touchstart',e=>{const b=e.target.closest('.swipe>.habit');rs=b?{b,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,drag:false,t0:0,hist:[]}:null;if(b)b.classList.remove('snap')},{passive:true});
document.addEventListener('touchmove',e=>{if(!rs)return;const dx=e.touches[0].clientX-rs.x,dy=e.touches[0].clientY-rs.y;
  if(!rs.drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2)rs.drag=true;
  if(rs.drag){rs.b.parentNode.classList.add('sw');rs.dx=dx<0?dx:(dx*rs.b.offsetWidth*.55)/(rs.b.offsetWidth+.55*dx)*.35;rs.hist.push([performance.now(),dx]);if(rs.hist.length>5)rs.hist.shift();rs.b.style.transform=`translateX(${rs.dx}px)`}},{passive:true});
document.addEventListener('touchend',()=>{if(!rs)return;const r=rs;rs=null;if(!r.drag)return;noClick=Date.now();
  const hs=r.hist,v=hs.length>1?(hs[hs.length-1][1]-hs[0][1])/Math.max(1,hs[hs.length-1][0]-hs[0][0]):0;
  if(r.dx<-90||(r.dx<-24&&v<-0.5)){if(navigator.vibrate)navigator.vibrate(8);r.b.classList.add('out');setTimeout(()=>deleteRem(r.b.dataset.id),190)}
  else{r.b.classList.add('snap');r.b.style.transform='';setTimeout(()=>r.b.parentNode&&r.b.parentNode.classList.remove('sw'),220)}},{passive:true});
let swEl=null;
document.addEventListener('touchstart',e=>{swEl=e.target.closest('.cost');if(swEl){sx=e.touches[0].clientX;sy=e.touches[0].clientY}else sx=null},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){if(swEl&&swEl.id==='chartcard')setChart(dx<0?'goal':'edge');else setSide(dx<0?'biz':'priv')}},{passive:true});
document.addEventListener('input',e=>{
  const el=e.target,t=today();
  if(el.dataset.refl){
    S.refl[t]=S.refl[t]||{a:'',b:''};S.refl[t][el.dataset.refl]=el.value;save();
  }
});

/* ---------- start ---------- */
(async()=>{
  S=Object.assign(fresh(),JSON.parse(JSON.stringify(BAKED)));
  S.rem=clone(REM.lists[0].items);
  let done=false;const st=initStorage().then(()=>{done=true});
  await Promise.race([st,new Promise(r=>setTimeout(r,2500))]);
  day(today());ui.boot=true;ui.draw=true;render();ui.boot=false;
  if(!done){await st;day(today());render()}
  save();
  if(!answered(today()))setTimeout(openQ,RM()?0:650);else afterQ();
  let last=today();
  setInterval(()=>{if(today()!==last){last=today();day(last);render();if(!answered(last))openQ()}},60000);
})();
</script>
</body>
