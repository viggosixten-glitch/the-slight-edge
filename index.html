<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6;
  --green:#10D95B;--red:#FF5B4A;--teal:#C3F07A;--violet:#63F29A;--amber:#FFB81C;
  --disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --ser:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6}}
:root[data-theme="dark"]{--bg:#08080B;--s1:#08080B;--s2:#1C1C22;--tx:#F5F4F7;--mu:#9B9AA6}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none;font-optical-sizing:auto}
button,[role="button"],.chip,.mini,.tl{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.swipe>.habit{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lbl,.st,.sm,.mu,.legend span,.chip,.lbl2,.qmeta,.qlater,.hero-q span,.edge,.frow,.due,.warn{letter-spacing:.01em}
.h2,.cost .ttl{letter-spacing:-.025em}
.qstage{overscroll-behavior:contain}
html,body{background:var(--bg);color:var(--tx);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{padding:12px 12px 56px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:0;border-radius:14px;padding:12px 14px;width:100%;outline:none}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:#6E6D78}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* Hero */
.hero{position:relative;border-radius:46px;overflow:hidden;aspect-ratio:3/4;max-height:560px;width:100%;background:var(--s1)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,11,.62) 0%,rgba(8,8,11,.05) 24%,rgba(8,8,11,.42) 52%,rgba(8,8,11,.88) 76%,rgba(8,8,11,.99) 100%)}
.hero-top{position:absolute;z-index:2;top:16px;left:18px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-top .d{font-weight:700;font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.hero-q{position:absolute;z-index:2;left:22px;right:22px;bottom:24px}
.hero-q p{font-family:var(--ser);font-style:italic;font-size:clamp(27px,7.4vw,36px);line-height:1.12;letter-spacing:-.01em}
.hero-q span{display:block;margin-top:12px;color:var(--mu);font-size:14px;font-weight:700}

/* Cards */
.card{background:var(--s1);border-radius:42px;padding:20px}
.h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu)}

.north{background:var(--violet);color:var(--bg);text-align:left;width:100%}
.north .big{font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.north .sub{margin-top:14px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:10px;border-radius:999px;background:rgba(16,13,24,.22);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--bg)}

.money{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{text-align:left;border-radius:38px;padding:18px 16px;background:var(--s1);display:flex;flex-direction:column;gap:4px;min-height:132px}
.mcard .lbl{font-size:13px;font-weight:700}
.mcard .amt{font-size:clamp(22px,6vw,27px);font-weight:800;letter-spacing:-.03em;margin-top:auto}
.mcard .sm{font-size:12px;color:var(--mu);font-weight:600}

/* Habits */
.today-h{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 4px 2px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;opacity:.25}
.dots i.on{opacity:1}
.habit{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--s1);border-radius:32px;padding:16px;transition:background-color .18s ease,color .18s ease,transform .1s ease}
.habit:active{transform:scale(.985)}
.habit .dot{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
.habit .dot svg{opacity:0;transition:opacity .15s}
.habit .mid{min-width:0;flex:1}
.habit .area{font-size:13px;font-weight:800}
.habit .txt{font-size:19px;font-weight:700;line-height:1.2;margin-top:2px}
.habit .warn{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.habit .stk{text-align:right;flex:none}
.habit .stk b{display:block;font-size:24px;font-weight:800;line-height:1}

.swipe{position:relative;border-radius:32px;overflow:hidden}
.swipe>.del{position:absolute;top:1.5px;bottom:1.5px;right:1.5px;left:1.5px;clip-path:inset(0 0 0 100% round 30px);border-radius:30px;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:var(--bg);font-weight:800;font-size:14px;overflow:hidden;white-space:nowrap}
.swipe:not(.sw)>.del{visibility:hidden}
.swipe>.del>.dt{position:absolute;right:0;top:0;bottom:0;width:25%;display:flex;align-items:center;justify-content:center}
.swipe>.del.snap{transition:clip-path .32s var(--ease-out)}
.swipe.sw>.habit,.swipe.sw>.del{will-change:transform,clip-path}
.swipe>.del.full{transition:clip-path .22s var(--ease-out);clip-path:inset(-1px round 32px)!important;inset:0!important;border-radius:32px}

.swipe.gone{transition:transform .45s var(--ease-io),opacity .45s var(--ease-io)!important;opacity:0}
.swipe.gone-l{transform:translateX(-112%)}.swipe.gone-r{transform:translateX(112%)}
.bubble{position:fixed;z-index:60;display:grid;place-items:center;pointer-events:none;overflow:hidden;will-change:transform,opacity}

body{overflow-anchor:none}

/* Färgmoln */
.glow{--g1:70,70,90;--g2:90,90,110;--g3:130,130,150;--ga:1;--gh:190px;
  position:relative;background-color:#0B0B0F;overflow:hidden;
  background-image:
    radial-gradient(58% calc(var(--gh)*.60) at 27% calc(100% + var(--gh)*.05),rgba(255,255,255,calc(.95*var(--ga))) 0%,rgba(255,255,255,.34) 32%,rgba(255,255,255,0) 62%),
    radial-gradient(72% calc(var(--gh)*.94) at 19% calc(100% + var(--gh)*.10),rgba(var(--g3),var(--ga)) 0%,rgba(var(--g3),.48) 36%,rgba(var(--g3),0) 72%),
    radial-gradient(84% calc(var(--gh)*1.08) at 81% calc(100% + var(--gh)*.12),rgba(var(--g2),var(--ga)) 0%,rgba(var(--g2),.52) 38%,rgba(var(--g2),0) 74%),
    radial-gradient(150% calc(var(--gh)*1.5) at 50% calc(100% + var(--gh)*.3),rgba(var(--g1),calc(.98*var(--ga))) 0%,rgba(var(--g1),.42) 46%,rgba(var(--g1),0) 80%),
    linear-gradient(180deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 30%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.17),inset 0 0 14px 1px rgba(255,255,255,.18),

.glow .mu,.glow .sm,.glow .st,.glow .gm,.glow .lbl,.glow .lbl2,.glow .streaktxt,.glow small,.glow p,.glow .frow{text-shadow:0 1px 2px rgba(0,0,0,.55),0 1px 7px rgba(0,0,0,.4)}
.bloom{position:relative;background-color:#0B0B0F;

  background:radial-gradient(120% calc(var(--gh)*1.1) at 50% calc(100% + var(--gh)*.16),rgba(255,255,255,.55) 0%,rgba(var(--g2),.5) 38%,rgba(var(--g2),0) 70%)}

  background:rgba(8,8,12,.2);-webkit-backdrop-filter:blur(20px) saturate(0%) brightness(.8);backdrop-filter:blur(20px) saturate(0%) brightness(.8);display:flex;flex-direction:column;padding:22px 20px 20px;overflow:hidden;

  const t=text.trim();if(!t)return;

  (S.logs||[]).forEach(e=>{const o=toks(e.t),i=o.filter(w=>tk.includes(w)).length,sc=i/Math.max(1,Math.min(o.length,tk.length));

}

}

function streakDays(){
  let k=today(),n=0;
  if(dayFactor(k)<=1)k=addDays(k,-1);
  while(k>=S.start&&dayFactor(k)>1){n++;k=addDays(k,-1)}
  return n;
}

function flyBubble(fr,id,text){
  const R=Math.random,size=Math.round(46+R()*34),s2=size/2;
  const cx0=fr.left+fr.width/2,cy0=fr.top+fr.height/2;
  const b=document.createElement('div');b.className='bubble';
  Object.assign(b.style,{left:fr.left+'px',top:fr.top+'px',width:fr.width+'px',height:fr.height+'px',borderRadius:'24px',background:'#1F1F23'});

  document.body.appendChild(b);
  const reveal=()=>{b.remove();const t2=document.querySelector(`.swipe[data-id="${id}"]`);if(t2){t2.classList.add('arrived');t2.classList.remove('arriving');setTimeout(()=>t2.classList.remove('arrived'),340)}};
  if(!b.animate){reveal();return}

  b.animate([{left:fr.left+'px',top:fr.top+'px',width:fr.width+'px',height:fr.height+'px',borderRadius:'24px',backgroundColor:'#1F1F23'},
    {left:(cx0-s2)+'px',top:(cy0-s2)+'px',width:size+'px',height:size+'px',borderRadius:s2+'px',backgroundColor:'#10D95B'}],{duration:M,easing:E,fill:'forwards'});
  b.querySelector('.bt').animate([{opacity:1},{opacity:0}],{duration:M*.45,easing:E,fill:'forwards'});
  b.querySelector('svg').animate([{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],{duration:M*.8,delay:M*.35,easing:E,fill:'forwards'});
  setTimeout(()=>{
    const tg=document.querySelector(`.swipe[data-id="${id}"]`);const tr=tg?tg.getBoundingClientRect():{left:cx0-s2,top:innerHeight,width:size,height:size};
    const x1=tr.left+tr.width/2-cx0,y1=Math.min(tr.top+tr.height/2,innerHeight-s2-24)-cy0;
    const dir=R()<.5?-1:1,cx=x1/2+dir*(50+R()*110),cy=y1*(.25+R()*.3)-(10+R()*50);
    const peak=1.05+R()*.4,rot=dir*(10+R()*28),dur=620+R()*300,N=10,kf=[];
    for(let i=0;i<=N;i++){const t=i/N,u=1-t,x=2*u*t*cx+t*t*x1,y=2*u*t*cy+t*t*y1;
      kf.push({transform:`translate(${x}px,${y}px) scale(${1+(peak-1)*Math.sin(Math.PI*t)}) rotate(${rot*Math.sin(Math.PI*t)}deg)`,opacity:1,offset:t*.9})}
    kf.push({transform:`translate(${x1}px,${y1}px) scale(1.25)`,opacity:0,offset:1});
    const an=b.animate(kf,{duration:dur,easing:'cubic-bezier(.45,0,.3,1)',fill:'forwards'});an.onfinish=reveal;
  },M);
}

}

function goalText(){

function goalChart(){
  const ms=months();while(ms.length<4)ms.push(addDays(ms[ms.length-1]+'-01',32).slice(0,7));
  const cur=today().slice(0,7),curRev=revOf(cur);
  const W=300,H=240,L=30,R=8,T=16,B=12,split=L+(W-L-R)*.62;
  const lo=500,hi=260000,lg=Math.log10;
  const Y=v=>T+(1-(lg(Math.max(lo,v))-lg(lo))/(lg(hi)-lg(lo)))*(H-T-B);
  const X=i=>L+(i/ms.length)*(split-L-6);
  const step=f=>{let d='',prev=null;ms.forEach((m,i)=>{if(m>cur)return;const v=f(m);if(!v){prev=null;return}
    const y=Y(v).toFixed(1);d+=(prev===null?'M':'L')+X(i).toFixed(1)+' '+y+'L'+X(i+1).toFixed(1)+' '+y;prev=v});return d};
  const path=(f,c)=>{const d=step(f);return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''};
  const flat=(v,c,t,below)=>v?`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="3" stroke-linecap="round"${ui.drawNow?' pathLength="1" class="draw"':''}/>`:'';
  const next=GOALS.find(x=>x>curRev);
  const grid=[1000,10000,100000].map(v=>`<line x1="${L}" x2="${split}" y1="${Y(v)}" y2="${Y(v)}" stroke="#34343B" stroke-width="1"/><text x="${L-5}" y="${Y(v)+3.5}" fill="#A2A1AB" font-size="9.5" font-weight="700" font-family="inherit" text-anchor="end">${krK(v)}</text>`).join('');
  const zx=i=>split+14+i*((W-R-split-26)/(GOALS.length-1));
  const dots=GOALS.map((v,i)=>{const ok=curRev>=v,x=zx(i),y=Y(v);
    return `<circle cx="${x}" cy="${y}" r="${v===GOAL?7:5.5}" fill="${ok?'#10D95B':'#F5F4F7'}"${ui.drawNow?` class="popin" style="animation-delay:${.35+i*.07}s"`:''}/>
    <text x="${x-9}" y="${y+3.5}" fill="${ok?'#10D95B':'#F5F4F7'}" font-size="10" font-weight="800" font-family="inherit" text-anchor="end">${v===GOAL?'Lön från AB':krK(v)}</text>`}).join('');
  const nl=next?`<line x1="${L}" x2="${zx(GOALS.indexOf(next))}" y1="${Y(next)}" y2="${Y(next)}" stroke="#F5F4F7" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>`:'';
  const mlab=ms.map((m,i)=>(i===0||m===cur||i===ms.length-1)?`<text x="${(X(i)+X(i+1))/2}" y="${H-6}" fill="${m===cur?'#F5F4F7':'#A2A1AB'}" font-size="10" font-weight="700" font-family="inherit" text-anchor="middle">${MON[+m.slice(5)-1].slice(0,3)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Omsättning och lön per månad mot målen">
    ${curRev?`<rect x="${L}" y="${Y(curRev)}" width="${W-R-L}" height="${Math.max(0,H-B-Y(curRev))}" fill="#63F29A" opacity=".14"${ui.drawNow?' class="fadein"':''}/>`:''}${grid}${nl}${flat(salOf(cur),'#C3F07A','Din lön',salOf(cur)<curRev&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${flat(curRev,'#63F29A','Omsättning',curRev<=salOf(cur)&&Math.abs(Y(salOf(cur))-Y(curRev))<18)}${dots}</svg>`;
}
function chart(){
  const v=curve(),n=v.length-1;
  const xmax=ui.range==='30'?Math.max(30,n):Math.max(365,n);
  const W=340,H=200,L=6,R=46,T=12,B=24;
  const rate=Math.pow(v[n],1/n);
  const proj=[];if(ui.range==='365'){for(let x=n;x<=xmax;x++)proj.push([x,v[n]*Math.pow(rate,x-n)])}
  const vis=v.slice(0,xmax+1);
  const ys=[2,Math.pow(1.01,xmax),Math.pow(.99,xmax),...vis,...proj.map(p=>p[1])];
  const ymax=Math.max(...ys)*1.04,ymin=Math.min(...ys,1)*(ui.range==='30'?.98:1);
  const X=x=>L+(x/xmax)*(W-L-R), Y=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  const path=f=>{let d='';const st=Math.max(1,Math.floor(xmax/120));for(let x=0;x<=xmax;x+=st)d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(f(x)).toFixed(1);d+='L'+X(xmax).toFixed(1)+' '+Y(f(xmax)).toFixed(1);return d};
  const you=vis.map((y,x)=>(x?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const pj=proj.length?proj.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(''):'';
  const sE=Math.pow(1.01,xmax),fE=Math.pow(.99,xmax);
  const lbl=y=>'×'+(y>=10?dec(y,0):dec(y,2));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurva över din utveckling jämfört med success- och failure-kurvan">
    <line x1="${L}" x2="${W-R}" y1="${Y(1)}" y2="${Y(1)}" stroke="#45454D" stroke-width="1.5" stroke-dasharray="3 5"/>
    <line x1="${L}" x2="${W-R}" y1="${Y(2)}" y2="${Y(2)}" stroke="${v[n]>=2?'#10D95B':'#F5F4F7'}" stroke-width="1.5" stroke-dasharray="3 5" opacity=".55"/>
    <text x="${X(Math.min(70,xmax))<(W-R)/2?X(Math.min(70,xmax))+10:L}" y="${Y(2)-(X(Math.min(70,xmax))<(W-R)/2?12:8)}" fill="${v[n]>=2?'#10D95B':'#F5F4F7'}" font-size="11" font-weight="800" font-family="inherit">100 % bättre${v[n]>=2?', nått':''}</text>
    <path d="${path(x=>Math.pow(1.01,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#10D95B" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    <path d="${path(x=>Math.pow(.99,x))}"${ui.drawNow?' pathLength="1" class="draw"':''} fill="none" stroke="#FF5B4A" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    ${pj?`<path d="${pj}" fill="none" stroke="#F5F4F7" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" opacity=".6"/>`:''}
    <path d="${you}"${ui.drawNow?' pathLength="1" class="draw" style="animation-delay:.3s"':''} fill="none" stroke="#F5F4F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(Math.min(70,xmax))}" cy="${Y(2)}" r="6.5" fill="${v[n]>=2?'#10D95B':'#F5F4F7'}"${ui.drawNow?' class="popin" style="animation-delay:.9s"':''}/>
    <circle cx="${X(n)}" cy="${Y(v[n])}" r="5.5" fill="#F5F4F7"${ui.drawNow?' class="popin" style="animation-delay:1.1s"':''}/>
    <text x="${W-R+6}" y="${Y(sE)+4}" fill="#10D95B" font-size="12" font-weight="800" font-family="inherit">${lbl(sE)}</text>
    <text x="${W-R+6}" y="${Math.min(H-B,Y(fE)+4)}" fill="#FF5B4A" font-size="12" font-weight="800" font-family="inherit">${lbl(fE)}</text>
    <text x="${L}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit">Dag 1</text>
    <text x="${W-R}" y="${H-6}" fill="#A2A1AB" font-size="11" font-weight="700" font-family="inherit" text-anchor="end">Dag ${xmax}</text>
  </svg>`;
}

let clearing=false;
function clearDone(){
  if(clearing)return;
  const items=[...document.querySelectorAll('.swipe[data-id]')].filter(sw=>S.doneLog[sw.dataset.id]);
  if(!items.length)return;
  const ids=items.map(sw=>sw.dataset.id);
  const fin=()=>{
    const before=S.rem.map(x=>({...x})),archBefore=[...(S.archive||[])];
    S.archive=[...S.rem.filter(x=>ids.includes(x.id)).map(x=>({id:x.id,t:x.t,done:S.doneLog[x.id],at:(S.doneAt||{})[x.id]})),...(S.archive||[])];
    S.rem=S.rem.filter(x=>!ids.includes(x.id));clearing=false;save();flipRender();
    sparks(document.querySelector('.today-h'),['#10D95B','#63F29A','#FFD04D'],Math.min(30,10+ids.length*6));
    pulse('#edgecard');
    if(ids.length>=3)receipt(`${ids.length} avklarade`,'Serie avslutad. Listan är ren.');
    showUndo(ids.length===1?'1 påminnelse rensad':ids.length+' påminnelser rensade',()=>{ui.fresh=ids;S.rem=before;S.archive=archBefore;save();flipRender()});
  };
  if(RM()){fin();return}
  clearing=true;if(navigator.vibrate)navigator.vibrate(10);
  items.forEach((sw,i)=>setTimeout(()=>{
    const card=sw.querySelector('.habit');card.classList.add('clearing');card.style.background='var(--green)';
    const ck=document.createElement('span');ck.className='ck';
    ck.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" pathLength="1" stroke="#DDFBE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    card.appendChild(ck);
    setTimeout(()=>sw.classList.add('gone','gone-r'),420);
  },i*150));
  setTimeout(fin,(items.length-1)*150+420+460);
}
function deleteRem(id){
  const i=S.rem.findIndex(x=>x.id===id);if(i<0)return;
  const item=S.rem[i];S.rem.splice(i,1);save();flipRender();
  showUndo('Påminnelse borttagen',()=>{ui.fresh=[item.id];S.rem.splice(Math.min(i,S.rem.length),0,item);save();flipRender()});
}

function swSet(card,o,q,anim){const sw=card.parentNode,del=sw.querySelector('.del');
  card.classList.toggle('snap',!!anim);if(del)del.classList.toggle('snap',!!anim);
  card.style.transform=o?`translateX(${o}px)`:'';
  if(del){const vis=-o+26;del.style.clipPath=o<0?`inset(0 0 0 ${Math.max(0,card.offsetWidth-2-vis)}px round 30px)`:''}}
function closeSw(card){if(!card||!card.isConnected){openSw=null;return}swSet(card,0,0,true);const sw=card.parentNode;openSw=null;setTimeout(()=>{if(openSw!==card&&sw)sw.classList.remove('sw')},340)}
document.addEventListener('touchstart',e=>{const b=e.target.closest('.swipe>.habit');
  if(openSw&&openSw!==b&&!e.target.closest('.del'))closeSw(openSw);
  rs=b?{b,x:e.touches[0].clientX,y:e.touches[0].clientY,drag:false,hist:[],base:b===openSw?-b.offsetWidth/4:0,o:0}:null},{passive:true});
document.addEventListener('touchmove',e=>{if(!rs)return;if(cmPress&&cmPress.lifted){rs=null;return}const dx=e.touches[0].clientX-rs.x,dy=e.touches[0].clientY-rs.y;
  if(!rs.drag){if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.5){rs.drag=true;rs.w=rs.b.offsetWidth;rs.q=rs.w/4;rs.b.parentNode.classList.add('sw');rs.x0=e.touches[0].clientX}else return}
  const fx=e.touches[0].clientX-rs.x0;
  let o=Math.min(0,rs.base+fx*.55);
  if(o<-rs.q)o=-rs.q-(-rs.q-o)*.3;
  rs.o=o;rs.hist.push([performance.now(),fx]);if(rs.hist.length>5)rs.hist.shift();
  swSet(rs.b,o,rs.q,false);
},{passive:true});
function swEnd(cancel){if(!rs)return;const r=rs;rs=null;if(!r.drag)return;noClick=Date.now();
  const hs=r.hist,v=hs.length>1?(hs[hs.length-1][1]-hs[0][1])/Math.max(1,hs[hs.length-1][0]-hs[0][0]):0;
  let open=r.base<0;
  if(!cancel)open=r.base<0?!(r.o>-r.q*.6||v>.5):(r.o<-r.q*.4||(v<-.5&&r.o<-12));
  if(open){swSet(r.b,-r.q,r.q,true);openSw=r.b;if(r.base===0&&navigator.vibrate)navigator.vibrate(6)}
  else closeSw(r.b);
}

const GB='#3E7BFF';
let G=null,L={},gymRef=null,gymLog=null,lastG='',lastL={},gSaveT=null;const gDirty=new Set();
function gFresh(){return{v:1,ex:[],pb:[],bw:{},ladder:{}}}
async function loadGym(db,uid){
  if(db&&uid){
    gymRef=db.doc('data/users/'+uid+'/gym');gymLog=gymRef.collection('log');
    const [g,ls]=await Promise.all([gymRef.get(),gymLog.get()]);
    if(g.exists)G=Object.assign(gFresh(),clone(g.data()));
    ls.docs.forEach(d=>{const v=clone(d.data());if(v&&v.e){L[d.id]=v.e;lastL[d.id]=JSON.stringify(v.e)}});
    lastG=g.exists?JSON.stringify(G):'';
  }else{
    const r=localStorage.getItem('lifedesigner:gym');if(r){const o=JSON.parse(r);if(o.G)G=Object.assign(gFresh(),o.G);L=o.L||{}}
  }
}
async function flushGym(){
  if(!loaded||!G)return;
  if(storageOK==='db'&&gymRef){
    const j=JSON.stringify(G);if(j!==lastG){try{await gymRef.set(JSON.parse(j));lastG=j}catch(e){}}
    for(const k of [...gDirty]){gDirty.delete(k);const e=L[k],j2=e&&Object.keys(e).length?JSON.stringify(e):'';
      if(j2===(lastL[k]||''))continue;
      try{if(j2)await gymLog.doc(k).set({e:JSON.parse(j2)});else await gymLog.doc(k).delete();lastL[k]=j2}catch(err){gDirty.add(k)}}
  }else if(storageOK==='local'){try{localStorage.setItem('lifedesigner:gym',JSON.stringify({G,L}))}catch(e){}}
}
function gsave(k){if(k)gDirty.add(k);clearTimeout(gSaveT);gSaveT=setTimeout(()=>{gSaveT=null;saving=saving.then(flushGym)},500)}
window.addEventListener('pagehide',()=>{if(gSaveT){clearTimeout(gSaveT);gSaveT=null;flushGym()}});

function renderGym(){

/* ---------- tryck på figuren ---------- */
let gPress=null,gBusy=false;
function gOn(g,on){document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.toggle('on',on))}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g)return;document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.add('hov'))});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g)return;const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#gym [data-part]');if(to&&to.dataset.part===g.dataset.part)return;document.querySelectorAll(`#gym [data-part="${g.dataset.part}"]`).forEach(x=>x.classList.remove('hov'))});
function gCommit(g){
  if(gBusy)return;gBusy=true;gOn(g,true);
  const k=g.dataset.part;
  setTimeout(()=>{if(k==='chest')showChoice(g);else openCat(k,g)},RM()?0:170);
}
function gCancel(){if(gPress){gOn(gPress.g,false);gPress=null}}
const gymEl=()=>document.getElementById('gym');
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('#gym [data-part]');if(!g||gBusy||e.button>0)return;gPress={g,x:e.clientX,y:e.clientY};gOn(g,true)});
document.addEventListener('pointermove',e=>{if(gPress&&Math.hypot(e.clientX-gPress.x,e.clientY-gPress.y)>10)gCancel()});
document.addEventListener('pointerup',e=>{if(!gPress)return;const p=gPress;gPress=null;
  const hit=document.elementFromPoint(e.clientX,e.clientY),h=hit&&hit.closest('[data-part]');
  if(h&&h.dataset.part===p.g.dataset.part)gCommit(p.g);else gOn(p.g,false)});
document.addEventListener('pointercancel',gCancel);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.querySelector('.gchoice'))closeChoice(true);else if(document.getElementById('gv'))closeCat();return}
  const g=e.target.closest&&e.target.closest('#gym [data-part]');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gCommit(g)}
});

/* ---------- bröst eller rygg ---------- */
let choiceG=null;
function showChoice(g){
  choiceG=g;const r=g.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.62;
  const s=document.createElement('div');s.className='gscrim';
  const c=document.createElement('div');c.className='gchoice';c.setAttribute('role','dialog');c.setAttribute('aria-label','Bröst eller rygg');
  c.innerHTML=`<button data-c="chest">Bröst</button><button data-c="back">Rygg</button>`;
  const left=Math.max(12,Math.min(innerWidth-264,cx-126));
  c.style.left=left+'px';c.style.top=cy+'px';c.style.transformOrigin=`${cx-left}px 0px`;
  document.body.append(s,c);
  s.onclick=()=>closeChoice(true);
  c.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;closeChoice(false);openCat(b.dataset.c,g)};
  if(!RM())c.animate([{opacity:0,transform:'scale(.55)'},{opacity:1,transform:'none'}],{duration:340,easing:'cubic-bezier(.32,.72,0,1)'});
  c.querySelector('button').focus({preventScroll:true});
}
function closeChoice(cancel){
  const c=document.querySelector('.gchoice'),s=document.querySelector('.gscrim');if(s)s.remove();if(!c)return;
  if(cancel){gBusy=false;if(choiceG)gOn(choiceG,false)}
  if(RM()||!cancel){c.remove();return}
  c.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.6)'}],{duration:180,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).onfinish=()=>c.remove();
}

/* ---------- kategorivy ---------- */
function openCat(cat,g){
  const r=g.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
  ui.gv={cat,part:g.dataset.part};ui.gform=null;ui.openEx=ui.openEx||{};
  const o=document.createElement('div');o.className='gv';o.id='gv';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',CATS[cat]);
  document.body.appendChild(o);document.body.style.overflow='hidden';
  gvRender();bindGv(o);gBusy=false;
  const bk=o.querySelector('.gback');if(bk)bk.focus({preventScroll:true});
  if(RM()){o.animate([{opacity:0},{opacity:1}],{duration:200});return}
  const R=Math.hypot(Math.max(ox,innerWidth-ox),Math.max(oy,innerHeight-oy)),col=cat==='pb'?'#FFB81C':GB;
  o.animate([{clipPath:`circle(18px at ${ox}px ${oy}px)`,backgroundColor:col},{backgroundColor:'#1F1F23',offset:.55},{clipPath:`circle(${R}px at ${ox}px ${oy}px)`,backgroundColor:'#1F1F23'}],{duration:520,easing:'cubic-bezier(.32,.72,0,1)'});
  const inn=o.querySelector('.gvin');if(inn)inn.animate([{opacity:0,transform:'translateY(16px) scale(.98)'},{opacity:1,transform:'none'}],{duration:420,delay:110,easing:'cubic-bezier(.23,1,.32,1)',fill:'backwards'});
}
function closeCat(){
  const o=document.getElementById('gv');if(!o||o.dataset.closing)return;o.dataset.closing='1';

  if(RM()||!g){o.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'}).onfinish=fin;return}

function lastLog(id){
  const t=today();const ks=Object.keys(L).filter(k=>k<t&&L[k][id]&&(L[k][id].r||[]).some(x=>x!=null)).sort();
  const k=ks[ks.length-1];return k?{d:k,...L[k][id]}:null;
}
function recOf(e){
  const cur=(L[today()]||{})[e.id];const src=cur&&cur.r&&cur.r[0]!=null?cur:lastLog(e.id);
  if(!src||src.r[0]==null||src.r[0]<e.thr||e.w>src.w)return null;return src;
}

function springTo(st,to,o,onF,onDone){
  cancelAnimationFrame(st.raf);st.raf=0;
  if(RM()){st.x=to;st.v=0;onF(to);onDone&&onDone();return}
  const w=2*Math.PI/(o.response||.4),k=w*w,c=2*(o.damping==null?1:o.damping)*w;let last=performance.now();
  const f=now=>{const dt=Math.min(.064,Math.max(0,(now-last)/1000));last=now;
    const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
    for(let i=0;i<n;i++){const a=-k*(st.x-to)-c*st.v;st.v+=a*h;st.x+=st.v*h}
    if(Math.abs(st.x-to)<.08&&Math.abs(st.v)<2){st.x=to;st.v=0;st.raf=0;onF(to);onDone&&onDone();return}
    onF(st.x);st.raf=requestAnimationFrame(f)};
  st.raf=requestAnimationFrame(f);
}

  document.querySelectorAll('.bso').forEach(x=>x.remove());

  o.innerHTML=`<div class="scrim"></div><div class="bs" role="dialog" aria-modal="true" style="${style||''}"><div class="grab" aria-hidden="true"><i></i></div>${html}</div>`;

const prMin=()=>PR.list.reduce((m,p)=>p.start<m?p.start:m,today());
function prRate(p,from,to){
  const t=today(),s=from>p.start?from:p.start;if(s>to)return null;
  if(p.freq!=='w'){let n=0,d=0;for(let k=s;k<=to;k=addDays(k,1)){const c=isChk(p,k);if(k===t&&!c)continue;n++;if(c)d++}return n?d/n:null}
  let num=0,den=0;
  for(let w=wkStart(s);w<=to;w=addDays(w,7)){const we=addDays(w,6),a=w>s?w:s,b=we<to?we:to;let c=0;
    for(let k=a;k<=b;k=addDays(k,1))if(isChk(p,k))c++;
    const tg=Math.min(p.per,diffDays(a,we)+1);if(we>=t&&c<tg)continue;num+=Math.min(c,tg);den+=tg}
  return den?num/den:null;
}
function missAsk(){
  const y=addDays(today(),-1);if(PR.asked[y])return null;
  const act=PR.list.filter(p=>p.start<=y&&!prGym(p));if(!act.length)return null;
  return act.some(p=>isChk(p,y))?null:y;
}

const DL=['M','T','O','T','F','L','S'];
function prRow(p,k){
  const on=isChk(p,k),w=p.freq==='w',lock=!canEditDay(k),wc=w?wkCount(p,k):0,meta=[];
  if(w)meta.push(`${p.per} ggr i veckan${p.gym?', räknar gympass':''}`);else if(p.kind==='main')meta.push('Varje dag');
  if(p.kind==='exp'){const dn=diffDays(p.start,today())+1;meta.push(dn>14?'Experimentet är klart':`Experiment, dag ${dn} av 14`)}
  return `<button class="prow${on?' on':''}${w&&wc>=p.per?' wkdone':''}${lock?' lock':''}${ui.ppop===p.id?' pop':''}" data-pid="${p.id}" data-press="1" aria-pressed="${on}">
    <span class="pck">${CHECK}</span><span class="ptx">${esc(p.t)}<small>${meta.join(' · ')}</small></span>${w?`<span class="pwk">${wc}<small>/${p.per}</small></span>`:''}</button>`;
}
function expRes(p){
  const dn=diffDays(p.start,today())+1;if(dn<=14)return '';
  const e=addDays(p.start,13);let held=0;for(let k=p.start;k<=e;k=addDays(k,1))if(isChk(p,k))held++;
  const mains=PR.list.filter(q=>q.kind==='main');
  const avg=(a,b)=>{const r=mains.map(q=>prRate(q,a,b)).filter(v=>v!==null);return r.length?Math.round(r.reduce((s,v)=>s+v,0)/r.length*100):null};
  const before=avg(addDays(p.start,-14),addDays(p.start,-1)),during=avg(p.start,e);
  let s=p.freq==='w'?`<b>${held} gånger på 14 dagar.</b>`:`<b>Du höll den ${held} av 14 dagar.</b>`;
  if(during!==null&&before!==null)s+=` Huvudprinciperna gick ${during>before?'bättre':during<before?'sämre':'lika bra'} under experimentet: <b>${before} % → ${during} %</b>.`;
  else if(during!==null)s+=` Huvudprinciperna under experimentet: <b>${during} %</b>.`;
  return `<div class="pres">${s}<br><button class="pmove" data-pa="move" data-pid="${p.id}">${ARROW}Flytta till princip</button></div>`;
}
function histSpan(){
  const t=today(),y=addDays(t,-1),c=addDays(t,7*ui.pwk),days=[...Array(15)].map((_,i)=>addDays(c,i-7)),k=ui.pday==='y'?y:t;
  const act=PR.list.filter(p=>p.start<=days[14]),main=act.filter(p=>p.kind==='main'),exp=act.filter(p=>p.kind==='exp');
  const head=`<div class="prh" aria-hidden="true"><span></span>${days.map(d=>{const wd=parseKey(d).getDay();return `<span class="${wd===0?'sun':''}${d>t?' fu':''}${d===t?' td':''}">${DL[(wd+6)%7]}<em>${+d.slice(8)}</em></span>`}).join('')}</div>`;
  const row=p=>`<div class="prr" data-press="1" data-pid="${p.id}" tabindex="0" role="button" aria-label="${esc(p.t)}, ${isChk(p,k)?'klar':'inte klar'} ${k===t?'idag':'igår'}"><span class="prn">${esc(p.t)}</span>${days.map(d=>{if(d<p.start)return '<i class="pc pre"></i>';if(d>t)return '<i class="pc fut"></i>';return `<i class="pc ${isChk(p,d)?'on':d===k?'pend':'miss'}" data-k="${d}"></i>`}).join('')}</div>`;
  const html=head+main.map(row).join('')+(exp.length?'<div class="prx">Experiment</div>'+exp.map(row).join(''):'');
  return {label:`${dlabel(days[0])} – ${dlabel(days[14])}`,prev:days[0]>prMin(),next:ui.pwk<0,html};
}
function histMonth(){
  const b=parseKey(today()),d=new Date(b.getFullYear(),b.getMonth()+ui.pmo,1,12),mk=keyOf(d).slice(0,7),t=today();
  const n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),days=[...Array(n)].map((_,i)=>mk+'-'+pad(i+1));
  const list=PR.list.filter(p=>p.start<=days[n-1]);
  const rows=list.map(p=>{let c=0;const cells=days.map(k=>{if(k<p.start)return '<i class="pre"></i>';if(k>t)return '<i class="fut"></i>';const on=isChk(p,k);if(on)c++;return `<i class="${on?'on':''}"></i>`}).join('');
    return `<div class="pgn"><span>${esc(p.t)}</span><b>${c}</b></div><div class="pmon" style="grid-template-columns:repeat(${n},1fr)">${cells}</div>`}).join('');
  const nm=MON[d.getMonth()];
  return {label:nm[0].toUpperCase()+nm.slice(1)+' '+d.getFullYear(),prev:mk>prMin().slice(0,7),next:ui.pmo<0,html:rows||'<p class="note">Inga principer den här månaden.</p>'};
}
function prLine(from){
  const t=today(),daily=PR.list.filter(p=>p.freq!=='w');if(!daily.length)return '';
  const s0=daily.reduce((m,p)=>p.start<m?p.start:m,t),s=from>s0?from:s0,pts=[];
  for(let k=s;k<=t;k=addDays(k,1)){const act=daily.filter(p=>p.start<=k);if(!act.length)continue;if(k===t&&!act.some(p=>isChk(p,k)))continue;pts.push([k,act.filter(p=>isChk(p,k)).length/act.length])}
  if(!pts.length)return '';
  const W=320,H=150,L=42,R=10,T=10,B=22,n=pts.length;
  const X=i=>L+(n>1?i/(n-1):.5)*(W-L-R),Y=v=>T+(1-v)*(H-T-B);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const area=n>1?`<path d="${d}L${X(n-1).toFixed(1)} ${H-B}L${X(0).toFixed(1)} ${H-B}Z" fill="url(#pla)"/>`:'';
  const grid=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2A2A32" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3.5}" fill="#A2A1AB" font-size="9.5" font-weight="700" font-family="inherit" text-anchor="end">${v*100} %</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andel klara dagliga principer per dag">
    <defs><linearGradient id="pla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient></defs>
    ${grid}${area}${n>1?`<path d="${d}" fill="none" stroke="#B794FF" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" class="draw"/>`:''}
    <circle cx="${X(n-1)}" cy="${Y(pts[n-1][1])}" r="5" fill="#F5F4F7" class="popin" style="animation-delay:.8s"/>
    <text x="${L}" y="${H-5}" fill="#A2A1AB" font-size="10" font-weight="700" font-family="inherit">${dlabel(pts[0][0])}</text>
    <text x="${W-R}" y="${H-5}" fill="#F5F4F7" font-size="10" font-weight="700" font-family="inherit" text-anchor="end">Idag</text></svg>`;
}
function prAnalysis(){
  const t=today(),r=ui.prr,from=r==='all'?prMin():addDays(t,-(+r-1));
  const bars=PR.list.map(p=>({p,v:prRate(p,from,t)})).filter(x=>x.v!==null);
  const avg=bars.length?Math.round(bars.reduce((s,x)=>s+x.v,0)/bars.length*100):null;
  const best=bars.length?bars.reduce((a,b)=>b.v>a.v?b:a):null;
  const col=v=>'#8B5CF6';
  return `<section class="pcard"><div class="row"><div class="h2">Analys</div><div class="seg">${[['7','7 d'],['30','30 d'],['all','Allt']].map(([k,l])=>`<button data-pa="rr" data-r="${k}" class="${r===k?'on':''}">${l}</button>`).join('')}</div></div>
    ${bars.length?`<div class="psum"><div><b>${avg} %</b><span>Snitt efterlevnad</span></div><div><b>${Math.round(best.v*100)} %</b><span>Starkast: ${esc(best.p.t.length>22?best.p.t.slice(0,21)+'…':best.p.t)}</span></div></div>
    <div class="pbars">${bars.map(x=>`<div><div class="pbl"><span>${esc(x.p.t)}</span><b>${Math.round(x.v*100)} %</b></div><div class="pbt"><i style="width:${Math.max(2,x.v*100)}%;background:${col(x.v)}"></i></div></div>`).join('')}</div>
    <div class="plc">${prLine(from)}</div>${PR.list.some(p=>p.freq!=='w')?'<p class="note">Linjen visar hur stor andel av dina dagliga principer du klarade varje dag.</p>':''}`
    :'<p class="note" style="margin-top:12px">Analysen fylls på när du har checkat av några dagar.</p>'}</section>`;
}
function renderPr(){
  const el=document.getElementById('pr');if(!el||!PR)return;
  const t=today(),dt=parseKey(t),miss=missAsk(),hv=histSpan(),fin=PR.list.filter(p=>p.kind==='exp'&&diffDays(p.start,t)>=14);
  let h=`<div class="pwrap"><div class="phd"><div><h1>Principer</h1><div class="mu">${DOW[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}</div></div><button class="padd" data-pa="add" aria-label="Ny princip">${ico('plus')}</button></div>`;
  if(miss)h+=`<div class="pmiss"><b>Igår är tomt</b><p>Missade du bara att anteckna igår?</p><div class="acts"><button class="btn" data-pa="missno">Nej, jag missade</button><button class="btn fill" data-pa="missyes">Ja, fyll i igår</button></div></div>`;
  if(ui.pday==='y')h+=`<div class="pfill"><span>${yLocked()?'Igår är låst.':'Tryck på en rad för att bocka av igår.'}</span><button data-pa="yday">Klar</button></div>`;
  if(!PR.list.length)h+=`<div class="pempty"><b>Skriv din första princip</b>En princip är en regel du lever efter. Tryck på + för att lägga till.</div>`;
  else h+=`<div class="pgrid" id="pgrid"><div class="pgin ppat" id="pgin">${hv.html}</div></div>${ui.pwk?`<button class="pback" data-pa="now">${hv.label} · Till idag</button>`:''}<p class="note" style="padding:0 2px">Tryck på en rad för att bocka av idag. Håll inne för att redigera.</p>`;
  h+=fin.map(expRes).join('')+'</div>';

function prToggle(id){
  const p=PR.list.find(x=>x.id===id);if(!p)return;
  const t=today(),k=ui.pday==='y'?addDays(t,-1):t;
  if(!canEditDay(k)){gToast('Igår är låst');return}
  const on=!isChk(p,k);setChk(p,k,on);
  if(on){vib(10);ui.ppop=id}
  renderPr();
  if(on){const act=PR.list.filter(q=>q.start<=k);if(act.length>1&&act.every(q=>dayDone(q,k))){sparks(document.querySelector('#pr .pring'),['#8B5CF6','#E879F9','#F5F4F7'],20);gToast(k===t?'Alla principer klara idag':'Alla principer klara igår')}}
}
function prSheet(id){
  const ex=id?PR.list.find(p=>p.id===id):null;
  const f={kind:ex?ex.kind:'main',freq:ex?ex.freq:'d',per:ex?ex.per||4:4,gym:ex?!!ex.gym:false};
  bsheet(`<h3>${ex?'Redigera princip':'Ny princip'}</h3>
    <div class="fld"><span>Princip</span><textarea id="prt" placeholder="När jag vaknar rör jag inte mobilen förrän dagens Att göra är satt">${ex?esc(ex.t):''}</textarea></div>
    <div class="fld"><span>Typ</span><div class="seg2" data-g="kind"><button data-v="main">Princip</button><button data-v="exp">Experiment, 14 dagar</button></div></div>
    <div class="fld"><span>Hur ofta</span><div class="seg2" data-g="freq"><button data-v="d">Varje dag</button><button data-v="w">Antal per vecka</button></div></div>
    <div class="fld" id="prw"><span>Gånger per vecka</span><div class="stepper"><button data-st="-1" aria-label="Färre">${ico('minus')}</button><b id="prper">${f.per}</b><button data-st="1" aria-label="Fler">${ico('plus')}</button></div></div>
    <div class="fld" id="prgy"><button class="tgl" role="switch" aria-checked="${f.gym}" id="prgt"><span>Räkna gympass automatiskt<small>Bocken sätts när du registrerar ett pass på huvudsidan eller gymsidan.</small></span><span class="sw"></span></button></div>
    <div class="acts"><button class="btn" data-x="no">Avbryt</button><button class="btn fill" data-x="ok" style="background:linear-gradient(120deg,#6D3AF0,#B436D6)">${ex?'Spara':'Lägg till'}</button></div>
    ${ex&&ex.kind==='exp'?`<button class="danger" data-x="move" style="color:var(--mu)">Flytta till princip</button>`:''}
    ${ex?'<button class="danger" data-x="del">Ta bort princip</button>':''}`,
  (bs,o)=>{
    const sync=()=>{bs.querySelectorAll('.seg2').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',f[s.dataset.g]===b.dataset.v)));
      bs.querySelector('#prw').hidden=f.freq!=='w';bs.querySelector('#prgy').hidden=f.freq!=='w';bs.querySelector('#prper').textContent=f.per;bs.querySelector('#prgt').setAttribute('aria-checked',f.gym)};
    sync();
    bs.addEventListener('click',e=>{
      const sb=e.target.closest('.seg2 button');if(sb){f[sb.parentNode.dataset.g]=sb.dataset.v;sync();return}
      const st=e.target.closest('[data-st]');if(st){f.per=clampV(f.per+(+st.dataset.st),1,7);sync();return}
      if(e.target.closest('#prgt')){f.gym=!f.gym;sync();return}
      const x=e.target.closest('[data-x]');if(!x)return;
      if(x.dataset.x==='no')o.close();
      else if(x.dataset.x==='ok'){const t=bs.querySelector('#prt').value.trim();if(!t){bs.querySelector('#prt').focus();return}
        const v={t,kind:f.kind,freq:f.freq,per:f.per,gym:f.freq==='w'&&f.gym};
        if(ex){if(ex.kind==='main'&&v.kind==='exp')v.start=today();Object.assign(ex,v)}
        else PR.list.push({id:'p'+newId(),...v,start:today()});
        prsave();o.close();renderPr();gToast(ex?'Ändringar sparade':'Princip tillagd')}
      else if(x.dataset.x==='move'){ex.kind='main';prsave();o.close();renderPr();gToast('Flyttad till principer')}
      else if(x.dataset.x==='del'){const i=PR.list.indexOf(ex);PR.list.splice(i,1);prsave();o.close();renderPr();
        showUndo('Princip borttagen',()=>{PR.list.splice(Math.min(i,PR.list.length),0,ex);prsave();renderPr()})}
    });
    if(!ex)setTimeout(()=>{try{bs.querySelector('#prt').focus({preventScroll:true})}catch(e){}},350);
  });
}
let prPress=null,gridDrag=0,prSw=null;
function prInit(){
  const el=document.getElementById('pr');
  el.addEventListener('pointerdown',e=>{
    const r=e.target.closest('[data-press]');
    if(r&&e.button===0){const pc=e.target.closest('.pc');prPress={r,x:e.clientX,y:e.clientY,fired:false,k:pc?pc.dataset.k:null};r.classList.add('press','hold');
      prPress.t=setTimeout(()=>{if(!prPress||prPress.r!==r)return;prPress.fired=true;r.classList.remove('press','hold');vib(12);prSheet(r.dataset.pid)},1000)}
    const g=e.target.closest('#pgrid');
    if(g&&e.button===0)prSw={x0:e.clientX,y0:e.clientY,s:[],drag:false,id:e.pointerId,g};
  });
  el.addEventListener('pointermove',e=>{
    if(prPress&&Math.hypot(e.clientX-prPress.x,e.clientY-prPress.y)>10){clearTimeout(prPress.t);prPress.r.classList.remove('press','hold');prPress=null}
    if(!prSw||e.pointerId!==prSw.id)return;pushS(prSw.s,e);
    const dx=e.clientX-prSw.x0,dy=e.clientY-prSw.y0;
    if(!prSw.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){prSw.drag=true;prSw.x0=e.clientX;try{prSw.g.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>10){prSw=null}return}
    const hv=histSpan();let x=e.clientX-prSw.x0;
    if((x<0&&!hv.next)||(x>0&&!hv.prev))x=Math.sign(x)*rubber(Math.abs(x),260);
    prSw.x=x;document.getElementById('pgin').style.transform=`translate3d(${x}px,0,0)`;
  });
  const up=e=>{
    if(prPress){const p=prPress;prPress=null;clearTimeout(p.t);p.r.classList.remove('press','hold');if(!p.fired&&e.type==='pointerup'){const y=addDays(today(),-1);if(p.k===y&&ui.pday!=='y'){const q=PR.list.find(x=>x.id===p.r.dataset.pid);if(!q)return;if(!canEditDay(y)){gToast('Igår är låst');return}const on=!isChk(q,y);setChk(q,y,on);if(on)vib(8);renderPr()}else prToggle(p.r.dataset.pid)}}
    if(prSw&&e.pointerId===prSw.id){const s=prSw;prSw=null;if(!s.drag)return;gridDrag=Date.now();
      const hv=histSpan(),v=velOf(s.s).x,proj=(s.x||0)+project(v,.99);
      const dir=proj<-70&&hv.next?1:proj>70&&hv.prev?-1:0,gin=document.getElementById('pgin');
      if(!dir){const st={x:s.x||0,v};springTo(st,0,{damping:1,response:.35},x=>gin.style.transform=`translate3d(${x}px,0,0)`);return}
      prShift(dir,s.x||0)}
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('[data-press]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();prToggle(r.dataset.pid)}else if(r&&e.key==='e')prSheet(r.dataset.pid)});
  el.addEventListener('click',e=>{
    const r=e.target.closest('[data-press]');if(r&&e.detail===0){prToggle(r.dataset.pid);return}
    const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa,t=today(),y=addDays(t,-1);
    if(a==='day'){ui.pday=b.dataset.d;renderPr()}
    else if(a==='yday'){ui.pday='t';renderPr()}
    else if(a==='now'){ui.pwk=0;renderPr()}
    else if(a==='add')prSheet();
    else if(a==='missyes'){PR.asked[y]='yes';prsave();ui.pday='y';renderPr()}
    else if(a==='missno'){PR.asked[y]='no';prsave();ui.pday='t';renderPr();gToast('Igår räknas som missad')}
    else if(a==='cell'){if(Date.now()-gridDrag<350)return;const p=PR.list.find(x=>x.id===b.dataset.pid),k=b.dataset.k;if(!p||!canEditDay(k))return;const on=!isChk(p,k);setChk(p,k,on);if(on)vib(8);renderPr()}
    else if(a==='hv'){ui.phv=b.dataset.v;renderPr()}
    else if(a==='hprev')prShift(-1,0);
    else if(a==='hnext')prShift(1,0);
    else if(a==='rr'){ui.prr=b.dataset.r;renderPr()}
    else if(a==='move'){const p=PR.list.find(x=>x.id===b.dataset.pid);if(p){p.kind='main';prsave();renderPr();gToast('Flyttad till principer')}}
  });
}
function prShift(dir,from){
  const gin=document.getElementById('pgin'),w=gin?gin.offsetWidth:320;
  const apply=()=>{if(ui.phv==='m')ui.pmo=Math.min(0,ui.pmo+dir);else ui.pwk=Math.min(0,ui.pwk+dir);renderPr()};
  if(RM()||!gin||!gin.animate){apply();return}
  gin.animate([{transform:`translate3d(${from}px,0,0)`,opacity:1},{transform:`translate3d(${-dir*w*.6}px,0,0)`,opacity:0}],{duration:170,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'}).onfinish=()=>{
    apply();const g2=document.getElementById('pgin');if(g2)g2.animate([{transform:`translate3d(${dir*w*.4}px,0,0)`,opacity:0},{transform:'translate3d(0,0,0)',opacity:1}],{duration:280,easing:'cubic-bezier(.23,1,.32,1)'})};
}

<script>
/* Squircle-motor: ersätter border-radius med Apple-lika kontinuerliga hörn (corner smoothing .6).

(function(){

    lit:[[0,1.5,.4],[18,1,.34],[42,6,.2],[84,20,.11]],
    glow:[[0,1,.17],[14,1,.18],[34,4,.13],[74,18,.08]],
    bloom:[[0,1,.15],[16,2,.14]],
    hero:[[0,1,.2],[16,2,.17],[44,9,.1]],

      'L'+f(ox+w)+' '+f(oy+h-p)+
      'c0 '+a+' 0 '+ab+' '+(-d)+' '+abc+'a'+R+' '+R+' 0 0 1 '+(-arc)+' '+arc+'c'+(-c)+' '+d+' '+(-bc)+' '+d+' '+(-abc)+' '+d+
      'L'+f(ox+p)+' '+f(oy+h)+
      'c'+(-a)+' 0 '+(-ab)+' 0 '+(-abc)+' '+(-d)+'a'+R+' '+R+' 0 0 1 '+(-arc)+' '+(-arc)+'c'+(-d)+' '+(-c)+' '+(-d)+' '+(-bc)+' '+(-d)+' '+(-abc)+
      'L'+f(ox)+' '+f(oy+p)+
      'c0 '+(-a)+' 0 '+(-ab)+' '+d+' '+(-abc)+'a'+R+' '+R+' 0 0 1 '+arc+' '+(-arc)+'c'+c+' '+(-d)+' '+bc+' '+(-d)+' '+abc+' '+(-d)+'Z';
